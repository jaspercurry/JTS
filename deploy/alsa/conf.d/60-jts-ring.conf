# JTS SHM slot-ring ALSA device definitions.
#
# Ships the three `jts_ring` ioplug PCMs as PRODUCT devices. The definitions are
# safe to install on every box, but only the coupling reconciler opens them: on a
# ring-eligible solo box it arms `JASPER_FANIN_CAMILLA_COUPLING=shm_ring` plus
# `JASPER_OUTPUTD_CONTENT_BRIDGE=shm_ring`; otherwise the historical loopback /
# direct topology remains active.
#
# Two of the three are the full-range STEREO pair (Ring A capture + Ring B
# playback). The third, `jts_ring_active_playback`, is the ACTIVE ring — a
# roleful (crossover) box's post-crossover per-driver hop — and is armed only by
# an explicit `jasper-fanin-coupling-reconcile shm_ring`, never by the
# unattended default pass.
#
# Renderer-user resolvability (AGENTS.md, the PR #214 class): this is a
# system-wide /etc/alsa/conf.d/*.conf drop-in at mode 0644, so ANY user —
# including the CamillaDSP runtime user and the non-root renderer users
# (shairport-sync, pi) — can resolve these PCM names. bluealsa and jack already
# register PCMs from this same directory on the Pi. jasper-doctor's
# `check_renderer_device_resolvable` and the new `check_ring_platform_assets`
# codify the open probe.
#
# The ioplug .so (libasound_module_pcm_jts_ring.so) is compiled on the Pi from
# c/jts-ring-ioplug and installed to the arch ALSA plugin dir by
# deploy/lib/install/ring-platform.sh. `type jts_ring` resolves to it.
#
# Geometry note: period_frames / n_slots below are the production defaults for
# the low-latency ring graph. Ring A (program.ring, fan-in -> CamillaDSP) and
# Ring B (content.ring, CamillaDSP -> outputd) are both at the 2-slot floor.
# With 128-frame slots, Ring A contributes 2 x 128 / 48000 ~= 5.3 ms; the old
# 8-slot geometry paid ~=21 ms because the blocking-writer handshake pins fill at
# capacity. The paired CamillaDSP ring config is chunk 128 / target 128 /
# queuelimit 1; chunk 256 would span the entire 2-slot buffer.
#
# period_frames MATCHING (P2): the ring slot IS one outputd DAC period — the
# `jts_ring_playback` ioplug opens Ring B with the period_frames below, and
# jasper-outputd's ShmRingSource attaches with its resolved
# JASPER_OUTPUTD_PERIOD_FRAMES. A mismatch is a hard ioplug open() error. The
# packaged period is 1024 (not every DAC profile's declared latency floor is
# 128), so the static 128 here is NOT universally correct. The coupling
# reconciler PREFLIGHTs this at arm time: `ring_geometry_ready` refuses shm_ring
# (fail-safe to loopback) with a crisp "conf.d period N != outputd period M"
# reason when they diverge, rather than letting CamillaDSP's ring open fail with
# a confusing rollback.
#
# RING A'S PERIOD IS FIXED AT 128 — it is not free to follow a DAC. fan-in
# creates Ring A with rust/jasper-fanin/src/config.rs's COMPILE-TIME
# `RING_SLOT_FRAMES: u32 = 128` (mixer.rs passes it as the ring geometry; there
# is no env override), and c/jts-ring-ioplug pins the same default. Writing any
# other period_frames below would make CamillaDSP's ioplug attach expect a
# geometry fan-in never builds — a hard RING_ATTACH_FATAL ("ring header does not
# match expected geometry") that CRASHES shm_ring at arm rather than refusing
# it. Making the slot floor-derived across fan-in, the ioplug, the CamillaDSP
# emitter, and the negotiation model is issue #2147.
#
# PER-BOX RENDER. Within that constraint, jasper-audio-hardware-reconcile
# renders the period_frames values below from the active DAC profile's DECLARED
# LatencyFloor (jasper/audio_hardware/dac.py). The rule:
#   - declared floor whose outputd_period_frames EQUALS 128 -> rendered, written
#     only when it differs from what is already here (so an Apple box, whose
#     floor IS 128, never rewrites this file);
#   - declared floor with any other period -> REFUSED, logged as
#     result=skipped reason=ring_slot_fixed_128. That DAC keeps loopback
#     coupling and still gets its floor's outputd period/buffer geometry via
#     outputd.env, until #2147;
#   - no declared floor, or an unrecognized DAC -> left GENUINELY untouched.
# Neither refusal is a claim that the box cannot ring. What shm_ring actually
# needs is outputd's RESOLVED period to equal 128, and an operator
# JASPER_OUTPUTD_PERIOD_FRAMES in /etc/jasper/jasper.env outranks whatever the
# reconciler derives from a floor — jts4 armed the ring that way on 2026-08-14,
# with no floor declared at all, which is what put the floor below on its
# profile.
# So the values below are the shipped baseline, and today the render's live job
# is converging a conf.d that has drifted off 128 back onto it. install.sh
# re-lays this file verbatim on every deploy and runs the reconciler afterwards.
# jasper-doctor's `ring conf floor` check reports floor-vs-conf.d agreement.

# Ring A — CamillaDSP CAPTURES this: the ioplug READS the SHM ring that
# jasper-fanin writes (fan-in -> CamillaDSP hop). Path matches jasper-fanin's
# JASPER_FANIN_RING_PATH default.
pcm.jts_ring_capture {
    type jts_ring
    path "/dev/shm/jts-ring/program.ring"
    period_frames 128
    n_slots 2
}

# Ring B — CamillaDSP WRITES this: the ioplug WRITES the SHM ring that
# jasper-outputd reads (CamillaDSP -> outputd hop). Path matches
# jasper-outputd's DEFAULT_SHM_RING_PATH.
pcm.jts_ring_playback {
    type jts_ring
    path "/dev/shm/jts-ring/content.ring"
    period_frames 128
    n_slots 2
}

# ACTIVE ring — the roleful (crossover) box's CamillaDSP -> outputd hop. Same
# ioplug, same direction as Ring B, DIFFERENT program: this one carries the
# POST-crossover PER-DRIVER channels (woofer / tweeter / ...), where Ring B
# carries a full-range stereo program. The role rides the NAME, not the width:
# on a 2-way speaker the active program is also 2 channels, so no channel-count
# test can tell this ring from Ring B. That is why it gets its own PCM name, its
# own ring file, and outputd's own endpoint marker.
#
# The `format` / `channels` keys are OMITTED here exactly as they are above: an
# omitted key declares the C ioplug's own default (S16_LE / 2), so this block is
# a complete wire declaration for the shipped geometry, and a box that renders
# to the shipped values never gains a line. jasper-audio-hardware-reconcile
# renders the per-box values in place (jasper.ring_assets.render_ring_conf_wire
# only ever SUBSTITUTES inside an existing block — it never invents or deletes
# one, which is why this block ships static rather than being appended later).
#
# UNUSED on every box today, which is not the same as un-openable. Nothing
# targets it: the active emitters name it only once the coupling reconciler has
# armed the ring, and that path is explicit-CLI-only (never the unattended
# default pass).
#
# If something DOES open it on a never-armed box, the open SUCCEEDS. The ioplug's
# open is a role-neutral create-or-attach — `ring_mapping_open`
# (c/jts-ring-ioplug/jts_ring_shm.c) is shared verbatim by the writer and reader
# entry points and does `O_CREAT | O_EXCL` after ensuring the parent dir — so an
# absent ring is CREATED by whichever side opens first, by design (Ring A's
# reader is allowed to beat fan-in's writer to an empty tmpfs after a reboot;
# pinned by test_reader_creates_missing_parent_then_writer_attaches in
# test_ring_core.c). The consequence is a reader attached to a ring no one
# writes: timer-paced silence, not an open error. The only fatal open is
# valid-magic-but-wrong-geometry (-EINVAL).
#
# This corrects an earlier comment here that claimed the open "fails ... because
# the ring file does not exist". It does not fail, and the difference matters:
# it is the difference between a box that refuses loudly and one that goes
# quietly silent, which is what any reasoning about an un-armed ring endpoint
# rests on.
pcm.jts_ring_active_playback {
    type jts_ring
    path "/dev/shm/jts-ring/active-content.ring"
    period_frames 128
    n_slots 2
}
