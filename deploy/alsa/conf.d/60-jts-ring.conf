# JTS SHM slot-ring ALSA device definitions.
#
# Ships the three `jts_ring` ioplug PCMs as PRODUCT devices. They are safe to
# install on every box but stay inert until the coupling reconciler arms
# `JASPER_FANIN_CAMILLA_COUPLING=shm_ring` plus
# `JASPER_OUTPUTD_CONTENT_BRIDGE=shm_ring`; `jts_ring_active_playback` is armed
# only by an explicit `jasper-fanin-coupling-reconcile shm_ring`.
#
# alsa-lib parses /etc/alsa/conf.d on EVERY PCM open on the box, so a malformed
# block here breaks every renderer, and these files ship 0644 so the non-root
# renderer users can resolve the names (jasper-doctor's
# `check_renderer_device_resolvable` and `check_ring_platform_assets` run the
# open probe). The ioplug .so is compiled on the Pi from c/jts-ring-ioplug and
# installed by deploy/lib/install/ring-platform.sh; `type jts_ring` resolves to
# it.
#
# WIRE FORMAT: `format S32_LE` is SPELLED in every block. The C ioplug's own
# compiled-in default is S16_LE (JTS_RING_DEFAULT_FORMAT in
# c/jts-ring-ioplug/pcm_jts_ring.c, mirrored by
# jasper.ring_assets.RING_CONF_DEFAULT_FORMAT) while every resolver on the box
# defaults wide (jasper.fanin_coupling.resolve_ring_wire_format,
# jasper-fanin's RingWireFormat::from_env_value), so omitting the key would
# declare the opposite of what the other end resolves. An operator pinning
# JASPER_FANIN_RING_WIRE_FORMAT=S16_LE gets these three lines rewritten in
# place by jasper-audio-hardware-reconcile; the key is never deleted.
#
# DEPTH: Ring A and Ring B sit at the 2-slot floor. With 128-frame slots Ring A
# contributes 2 x 128 / 48000 ~= 5.3 ms; the old 8-slot geometry paid ~21 ms
# because the blocking-writer handshake pins fill at capacity. The paired
# CamillaDSP ring config is chunk 128 / target 128 / queuelimit 1 — chunk 256
# would span the entire 2-slot buffer.
#
# PERIOD 128 IS FIXED, not free to follow a DAC. fan-in creates Ring A with the
# compile-time RING_SLOT_FRAMES (rust/jasper-ring/src/layout.rs; no env
# override) and the ioplug pins the same default, so any other period_frames
# here makes CamillaDSP's attach expect a geometry fan-in never builds — a hard
# RING_ATTACH_FATAL that CRASHES shm_ring at arm rather than refusing it. The
# ring slot is also one outputd DAC period on Ring B, and the packaged outputd
# period is 1024, so 128 here is not universally correct: a conf.d/outputd
# divergence surfaces as that open() error, not a clean refusal. Making the
# slot floor-derived end to end is issue #2147.
#
# PER-BOX RENDER. Within that constraint jasper-audio-hardware-reconcile
# renders period_frames from the active DAC profile's declared LatencyFloor
# (jasper/audio_hardware/dac.py):
#   - floor whose outputd_period_frames EQUALS 128 -> rendered, written only
#     when it differs from what is already here;
#   - floor with any other period -> REFUSED, logged result=skipped
#     reason=ring_slot_fixed_128 (that DAC still gets its floor's outputd
#     period/buffer via outputd.env, until #2147);
#   - no declared floor, or an unrecognized DAC -> left untouched.
# Neither refusal claims the box cannot ring: what shm_ring needs is outputd's
# RESOLVED period to equal 128, and an operator JASPER_OUTPUTD_PERIOD_FRAMES in
# /etc/jasper/jasper.env outranks any floor-derived value. install.sh re-lays
# this file verbatim on every deploy and runs the reconciler afterwards;
# jasper-doctor's `ring conf floor` check reports floor-vs-conf.d agreement.

# Ring A — CamillaDSP CAPTURES this: the ioplug READS the SHM ring that
# jasper-fanin writes. Path matches jasper-fanin's JASPER_FANIN_RING_PATH
# default.
pcm.jts_ring_capture {
    type jts_ring
    path "/dev/shm/jts-ring/program.ring"
    period_frames 128
    n_slots 2
    format S32_LE
}

# Ring B — CamillaDSP WRITES this: the ioplug WRITES the SHM ring that
# jasper-outputd reads. Path matches jasper-outputd's DEFAULT_SHM_RING_PATH.
pcm.jts_ring_playback {
    type jts_ring
    path "/dev/shm/jts-ring/content.ring"
    period_frames 128
    n_slots 2
    format S32_LE
}

# ACTIVE ring — the roleful (crossover) box's CamillaDSP -> outputd hop. Same
# ioplug and direction as Ring B, different program: POST-crossover PER-DRIVER
# channels. The role rides the NAME, not the width — on a 2-way speaker the
# active program is also 2 channels — which is why it gets its own PCM name,
# ring file, and outputd endpoint marker.
#
# `channels` is omitted here exactly as above, taking the ioplug's default (2),
# so this block is a complete wire declaration for the shipped geometry:
# jasper.ring_assets.render_ring_conf_wire only ever SUBSTITUTES inside an
# existing block, never invents or deletes one.
#
# UNUSED on every box today, which is not un-openable: the ioplug's open is a
# role-neutral create-or-attach (`ring_mapping_open` does O_CREAT | O_EXCL
# after ensuring the parent dir), so an absent ring is CREATED by whichever
# side opens first — by design, since Ring A's reader may beat fan-in's writer
# to an empty tmpfs after a reboot. A reader attached to a ring no one writes
# gets timer-paced silence, not an open error. The only fatal open is
# valid-magic-but-wrong-geometry (-EINVAL).
pcm.jts_ring_active_playback {
    type jts_ring
    path "/dev/shm/jts-ring/active-content.ring"
    period_frames 128
    n_slots 2
    format S32_LE
}
