# JTS grouping-ingress ring PCM — the bonded endpoint's snapcast hop.
#
# WRITER: snapclient (deploy/systemd/jasper-snapclient.service), through its
# `--soundcard`. READER: the bonded endpoint's CamillaDSP, as its capture
# device. Neither of them names this PCM: the device ships ahead of its
# consumers, the way 60-jts-ring.conf and 61-jts-renderer-lanes.conf both did,
# so a geometry that fails on metal costs one file rather than a transport
# already flipped onto it.
#
# WHY THESE NUMBERS: derived once, in the grouping-ring design — §3.2 (period
# + depth), §3.3 (wire), §3.4 (path, and why the deploy's ring `rm -f` list
# leaves grouping.ring alone — see deploy/lib/install/ring-platform.sh). Not
# restated here. The Python half of the same identity, and the constants every
# consumer reads, is jasper/multiroom/grouping_ring.py.
#
# `format` and `channels` are SPELLED, not left to the ioplug's compiled
# defaults. This block's wire is bound to the snapcast stream's
# `sampleformat=48000:16:2` (jasper/multiroom/reconcile.py, snapserver_argv),
# which is owned elsewhere, so a reader must not have to know the plugin's
# default to know the wire. tests/test_grouping_ring_platform.py pins both ends
# of that binding.
#
# Renderer-user resolvability (AGENTS.md, the PR #214 class): a system-wide
# /etc/alsa/conf.d/*.conf drop-in at mode 0644, like both siblings. alsa-lib
# parses this directory on EVERY PCM open on the box, so a malformed block here
# would break every renderer — which is what the conf.d shape guard in
# tests/test_grouping_ring_platform.py is for.

# `pace_nominal` is declared HERE and nowhere else on the box. This PCM's writer
# is snapclient, whose ALSA player expects the DEVICE to pace it; without a
# nominal-clock ceiling it free-runs against the ring and hard-syncs forever. The
# renderer and content rings keep the field absent because their writers already
# carry a clock. What the field does is owned by jts_ring_pace_apply
# (c/jts-ring-ioplug/jts_ring_shm.h).

pcm.jts_ring_grouping {
    type jts_ring
    path "/dev/shm/jts-ring/grouping.ring"
    period_frames 128
    n_slots 16
    format S16_LE
    channels 2
    pace_nominal 1
}
