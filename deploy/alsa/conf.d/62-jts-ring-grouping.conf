# JTS grouping-ingress ring PCM — the bonded endpoint's snapcast hop.
#
# WRITER: snapclient (deploy/systemd/jasper-snapclient.service), through its
# `--soundcard`. READER: the bonded endpoint's CamillaDSP, as its capture
# device. Neither of them names this PCM; the Python half of the same identity
# is jasper/multiroom/grouping_ring.py.
#
# WHY THESE NUMBERS — period 128, 16 slots, S16_LE stereo, pace_nominal 1:
# See ADR-0268. `format` and `channels` are SPELLED rather than left to the
# ioplug's compiled defaults because this PCM is opened directly, with no
# `plug` wrapper to absorb a mismatch.
#
# `pace_nominal` governs the PLAYBACK direction only; this box's CamillaDSP
# captures the same PCM and is deliberately left ungoverned. What the field
# does is owned by jts_ring_pace_apply (c/jts-ring-ioplug/jts_ring_shm.h).

pcm.jts_ring_grouping {
    type jts_ring
    path "/dev/shm/jts-ring/grouping.ring"
    period_frames 128
    n_slots 16
    format S16_LE
    channels 2
    pace_nominal 1
}
