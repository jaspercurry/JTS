# JTS DAC-content return ring PCM — the grouping leader's round-trip hop.
#
# WRITER: a bonded DUMB member's snapclient, through its `--soundcard`
# (jasper.multiroom.reconcile._assemble_args; either role — a passive leader
# takes its own program back out of the sync engine the same way a follower
# takes the leader's). READER: jasper-outputd, one slot per DAC period, as its
# SOLE content source while JASPER_OUTPUTD_DAC_CONTENT_LANE is armed. Both ends
# read the PCM name from jasper.multiroom.dac_content_ring.DAC_CONTENT_RING_PCM.
#
# WHY THESE NUMBERS — period 128, 16 slots, S16_LE stereo, pace_nominal 1:
# See ADR-0268. The slot is the READER's period, so the floorless HiFiBerry
# DAC8x Studio (outputd at its packaged 1024) is the one profile that cannot
# arm this lane; outputd's config guard names that at startup.
#
# `pace_nominal` governs the PLAYBACK direction only. outputd is the strongest
# clock the loop can have — it owns the DAC — so the field is the floor under a
# stalled reader, not a substitute for that clock.

pcm.jts_ring_dac_content {
    type jts_ring
    path "/dev/shm/jts-ring/dac-content.ring"
    period_frames 128
    n_slots 16
    format S16_LE
    channels 2
    pace_nominal 1
}
