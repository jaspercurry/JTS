# JTS DAC-content return ring PCM — the grouping leader's round-trip hop.
#
# WRITER: a bonded DUMB member's snapclient, through its `--soundcard`
# (jasper.multiroom.reconcile._assemble_args; either role — a passive leader
# takes its own program back out of the sync engine the same way a follower
# takes the leader's). READER: jasper-outputd, one slot per DAC period, as its
# SOLE content source while JASPER_OUTPUTD_DAC_CONTENT_LANE is armed. Neither
# end spells this PCM twice: both read it from
# jasper.multiroom.dac_content_ring.DAC_CONTENT_RING_PCM.
#
# WHY THESE NUMBERS (#3656): the slot is the READER's period, and every DAC
# profile that declares a latency floor runs outputd at 128 —
# jasper.fanin_coupling.RING_SLOT_FRAMES, the slot every other ring on the box
# uses, and the one the grouping ring's snapclient (the same writer) already
# drives. The floorless HiFiBerry DAC8x Studio runs outputd at its packaged
# DEFAULT_PERIOD_FRAMES (1024) and is the one profile that cannot arm this lane;
# outputd's config guard names that at startup. The Python half of the same
# identity, and the constants every consumer reads, is
# jasper/multiroom/dac_content_ring.py; tests/test_dac_content_ring_platform.py
# pins the two together.
#
# `format` and `channels` are SPELLED, not left to the ioplug's compiled
# defaults. This block's wire is bound at BOTH ends by owners elsewhere — the
# snapcast stream's `sampleformat=48000:16:2` (jasper/multiroom/reconcile.py,
# snapserver_argv) and outputd's "S16 by contract" dac-content lane
# (rust/jasper-outputd/src/dac_content.rs) — so a reader must not have to know
# the plugin's default to know the wire.
#
# Renderer-user resolvability (AGENTS.md, the PR #214 class): a system-wide
# /etc/alsa/conf.d/*.conf drop-in at mode 0644, like all three siblings.
# alsa-lib parses this directory on EVERY PCM open on the box, so a malformed
# block here would break every renderer — which is what the conf.d shape guard
# in tests/test_dac_content_ring_platform.py is for.

# `pace_nominal` for the SAME REASON 62-jts-ring-grouping.conf declares it, and
# it is the same writer: snapclient's ALSA player expects the DEVICE to pace it,
# so against a reader that has stalled or died it storms. outputd is the
# strongest clock the loop can have — it owns the DAC — which is what holds the
# steady state at nominal; the field is the floor under the failure, not a
# substitute for that clock. It governs the PLAYBACK direction only.

pcm.jts_ring_dac_content {
    type jts_ring
    path "/dev/shm/jts-ring/dac-content.ring"
    period_frames 128
    n_slots 16
    format S16_LE
    channels 2
    pace_nominal 1
}
