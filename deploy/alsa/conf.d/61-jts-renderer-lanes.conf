# JTS renderer-ingress lane PCMs.
#
# The write side of a renderer's SHM slot ring: each `jts_ring` block here is
# the ALSA PCM a migrated renderer writes INSTEAD of its snd-aloop substream,
# and jasper-fanin reads the same ring file from the other end
# (rust/jasper-fanin/src/mixer/ring_capture.rs).
#
# INERT UNTIL ARMED. An ALSA PCM definition is not an open: nothing resolves
# these names until `jasper-audio-config renderer-lanes --arm <label>` has
# written the matching JASPER_<RENDERER>_DEVICE into
# /var/lib/jasper/renderer_lanes.env and the renderer has restarted. On an
# unarmed box the renderer keeps writing its `*_substream` alias in
# /etc/asound.conf. The snd-aloop lane definitions in
# deploy/alsa/asoundrc.jasper stay: a lane is on exactly one transport at a
# time, chosen per box.
#
# Resolving the NAME is only half of it — writing the ring FILE additionally
# needs the renderer user in the /dev/shm/jts-ring directory's group
# (`jts-ring`) and `UMask=0007` on the renderer unit, because BOTH ends write
# the ring header (the reader stamps read_seq + its heartbeat) and a file
# created under the default 0022 umask would land group-unwritable.
#
# GEOMETRY. A renderer ring's slot IS one jasper-fanin render period, and its
# depth is DERIVED from the aloop cushion it replaces:
#
#     period_frames = JASPER_FANIN_PERIOD_FRAMES            (shipped 256)
#     n_slots       = JASPER_FANIN_INPUT_BUFFER_FRAMES
#                     / JASPER_FANIN_PERIOD_FRAMES          (shipped 4096/256 = 16)
#
# The depth is derived rather than picked because the aloop lane gives the
# renderer exactly JASPER_FANIN_INPUT_BUFFER_FRAMES of cushion, and a renderer
# is a network player whose ALSA write blocks when its buffer fills: a
# different cushion silently changes how much network jitter it absorbs before
# it underruns. `format S32_LE` is the wire an undeclared box resolves
# (JASPER_FANIN_RING_WIRE_FORMAT defaults wide); nothing rewrites these blocks
# per box.
#
# A box that overrides a fan-in key moves the rule's output without moving this
# file. WHICH END fails depends on who creates the ring first: normally fan-in
# (`RingReader::create_or_attach` creates the file when absent), so its
# geometry lands in a fresh header and the RENDERER fails its own
# `snd_pcm_open`; against a ring left on tmpfs from a previous geometry, fan-in
# is the half that refuses, reporting `source:"ring"` with `attached:false` and
# `detach_reason:"geometry"` in /state while it renders silence and retries.
# `jasper-audio-config renderer-lanes` clears a geometry-mismatched ring on
# every arm/disarm; jasper-doctor's `check_renderer_ring_lanes` names either
# one. The fix is reverting the override or re-rendering these values — the
# ring header cannot describe two geometries.
#
# OWED ON-BOX CONFIRMATION: no renderer has ever opened one of these PCMs.
# Confirm on the first armed box that librespot negotiates cleanly, and that a
# deliberately mismatched period fails its open rather than degrading quietly.

# --- Spotify Connect (librespot) --------------------------------------------
#
# `channels` is OMITTED, which takes the ioplug's own default (2).
pcm.jts_ring_lane_spotify {
    type jts_ring
    path "/dev/shm/jts-ring/lane-spotify.ring"
    format S32_LE
    period_frames 256
    n_slots 16
}

# What librespot's --device points at once armed. The `plug:` wrapper is
# load-bearing: librespot emits 44.1 kHz S24_3, so SOMETHING must resample to
# 48 kHz, and doing it here keeps that conversion on
# `defaults.pcm.rate_converter` — the knob whose fallback to ALSA's built-in
# linear resampler costs ~12 dB of 4-8 kHz. The
# slave declares no `format`: the ring above owns the width, so the resampler's
# >16-bit result reaches fan-in rather than being truncated to 16 bits without
# dither.
pcm.librespot_ring_lane {
    type plug
    slave {
        pcm "jts_ring_lane_spotify"
        rate 48000
        channels 2
    }
}

# --- Bluetooth A2DP (bluealsa-aplay) ----------------------------------------
#
# The ring is named for the fan-in LANE (`bluealsa`, fan-in's own vocabulary —
# jasper/renderer_lanes.py), the plug PCM for the RENDERER.
pcm.jts_ring_lane_bluealsa {
    type jts_ring
    path "/dev/shm/jts-ring/lane-bluealsa.ring"
    format S32_LE
    period_frames 256
    n_slots 16
}

# What bluealsa-aplay's --pcm points at once armed. Bluetooth's negotiated PCM
# varies by codec and by peer (SBC/AAC, 44.1 or 48 kHz) and bluealsa-aplay
# opens whatever the connected device negotiated, so this is the one lane whose
# rate conversion is genuinely dynamic across connections — which is why it
# must stay on `defaults.pcm.rate_converter`.
pcm.bluealsa_ring_lane {
    type plug
    slave {
        pcm "jts_ring_lane_bluealsa"
        rate 48000
        channels 2
    }
}

# --- Correction / commissioning measurement lane ----------------------------
#
# The one UNITLESS lane: no renderer daemon writes it. Its writers are
# ephemeral `aplay` spawns (room-correction sweeps, commissioning tones, sync
# markers, AEC probes) routed through
# jasper.audio_measurement.correction_lane, which resolves armed-vs-unarmed per
# spawn. Arming therefore restarts jasper-fanin ONLY; there is no renderer unit
# to bounce. The lane's width does not change what a banked measurement was
# excited with: every producer plays a 16-bit WAV
# (jasper/audio_measurement/sweep.py, program.py).
pcm.jts_ring_lane_correction {
    type jts_ring
    path "/dev/shm/jts-ring/lane-correction.ring"
    format S32_LE
    period_frames 256
    n_slots 16
}

# What the correction-lane spawns open once armed. One conversion in this
# wrapper is LOAD-BEARING and is reproduced from the correction_substream alias
# it replaces DELIBERATELY: the plug's mono->stereo upmix. Six of the lane's
# producers emit MONO WAVs and three emit stereo; the plug duplicates a mono
# program to BOTH channels, which on an active 2-way graph means a woofer-only
# program also reaches the tweeter feed (#2046 records the consequence and the
# level-authority reasoning). Narrowing the upmix would break the six mono
# producers' opens outright; per-driver protection belongs to the CamillaDSP
# graph, not this wrapper.
pcm.correction_ring_lane {
    type plug
    slave {
        pcm "jts_ring_lane_correction"
        rate 48000
        channels 2
    }
}

# --- AirPlay 2 (shairport-sync) ---------------------------------------------
#
# The one lane whose device is delivered by a conf renderer rather than an
# ExecStart env substitution: /etc/shairport-sync.conf is re-rendered from its
# template on every unit start (jasper-apply-airplay-mode), and that script
# reads the lane map's resolved JASPER_SHAIRPORT_DEVICE line to pick between
# the shairport_substream aloop alias and this pair.
pcm.jts_ring_lane_airplay {
    type jts_ring
    path "/dev/shm/jts-ring/lane-airplay.ring"
    format S32_LE
    period_frames 256
    n_slots 16
}

# What the rendered shairport-sync.conf's output_device names once armed.
#
# This `plug:` wrapper converts NOTHING: shairport emits 48 kHz S32 stereo
# (output_rate/output_format in the rendered conf) into a lane at the same rate
# and width. The rate pair matches because it MUST — shairport 5.x probes the
# device with ALSA resampling disabled and exact-rate matching, so a wrapper
# rate differing from this slave's is struck from its permissible rate set and
# every session dies (see the output_rate note in
# deploy/shairport-sync.conf.template). shairport does the 44.1 -> 48
# conversion internally, which takes AirPlay off `defaults.pcm.rate_converter`
# entirely. AirPlay SYNC constants are derived from this lane's ring geometry —
# see the LANE GEOMETRY note atop deploy/shairport-sync.conf.template before
# retuning.
pcm.shairport_ring_lane {
    type plug
    slave {
        pcm "jts_ring_lane_airplay"
        rate 48000
        channels 2
    }
}
