# JTS renderer-ingress lane PCMs — audio-graph consolidation U3 / P6.
#
# The write side of a renderer's SHM slot ring: each block here is the ALSA PCM a
# migrated renderer writes INSTEAD of its snd-aloop substream, and jasper-fanin
# reads the same ring file from the other end
# (rust/jasper-fanin/src/mixer/ring_capture.rs).
#
# INERT UNTIL ARMED. Shipping these definitions on every box is safe and costs
# nothing: an ALSA PCM definition is not an open. Nothing resolves these names
# until `jasper-audio-config renderer-lanes --arm <label>` has written the
# matching JASPER_<RENDERER>_DEVICE into /var/lib/jasper/renderer_lanes.env and
# the renderer has restarted. On every unarmed box the renderer keeps writing its
# `*_substream` alias in /etc/asound.conf, byte-identically to before this file
# existed.
#
# The snd-aloop lane definitions in deploy/alsa/asoundrc.jasper STAY until P9.
# They are the not-yet-migrated boxes' path, not a fallback mode — a lane is on
# exactly one transport at a time, chosen per box, and both definitions existing
# is what makes the migration one lane at a time instead of one fleet at once.
#
# Renderer-user resolvability (AGENTS.md, the PR #214 class): this is a
# system-wide /etc/alsa/conf.d/*.conf drop-in at mode 0644, so the non-root
# renderer users (librespot as `pi`, shairport-sync as `shairport-sync`) can
# resolve these names. Resolving the NAME is only half of it — writing the ring
# FILE additionally needs the renderer user in the /dev/shm/jts-ring directory's
# group (`jts-ring`) and `UMask=0007` on the renderer unit, because BOTH ends
# write the ring header (the reader stamps read_seq + its heartbeat) and a file
# created under the default 0022 umask would land group-unwritable.
# jasper-doctor's `check_renderer_device_resolvable` runs the open probe against
# whichever device the renderer is actually configured with.
#
# GEOMETRY — why these numbers, and what breaks if they drift.
#
# A renderer ring's slot IS one jasper-fanin render period, and its depth is
# DERIVED from the aloop cushion it replaces:
#
#     period_frames = JASPER_FANIN_PERIOD_FRAMES            (shipped 256)
#     n_slots       = JASPER_FANIN_INPUT_BUFFER_FRAMES
#                     / JASPER_FANIN_PERIOD_FRAMES          (shipped 4096/256 = 16)
#
# The depth is derived rather than picked because the aloop lane gives the
# renderer exactly JASPER_FANIN_INPUT_BUFFER_FRAMES of cushion (fan-in opens the
# capture side with that buffer and snd-aloop locks the pair to it), and a
# renderer is a network player whose ALSA write blocks when its buffer fills.
# Handing it a different cushion would silently change how much network jitter it
# absorbs before it underruns — a behaviour change wearing a transport change's
# clothes. The values below are that rule evaluated at the SHIPPED fan-in
# geometry, which is what every box in the fleet runs.
#
# A box that overrides either fan-in key moves the rule's output without moving
# this file. That shear does NOT corrupt audio: fan-in's attach compares the full
# geometry against the ring header and refuses a mismatch, so the lane reports
# `source:"ring"` with `attached:false` and `detach_reason:"geometry"` in
# /state and renders silence. jasper-doctor's `check_renderer_ring_lanes` names
# the disagreement. Fixing it means either reverting the fan-in override or
# re-rendering these two values to match; there is no third option, because the
# ring header cannot describe two geometries.
#
# The ioplug .so (libasound_module_pcm_jts_ring.so) is compiled on the Pi from
# c/jts-ring-ioplug and installed by deploy/lib/install/ring-platform.sh, which
# also installs this file. `type jts_ring` resolves to it.

# --- Spotify Connect (librespot) — P6a -------------------------------------
#
# The ring itself. `format` / `channels` are OMITTED, which declares the ioplug's
# own defaults (S16_LE / 2) — the same convention as 60-jts-ring.conf, and the
# right wire here: a renderer lane is 48 kHz S16_LE at its boundary today and U3
# moves the transport, not the width. Widening a renderer lane is a separate
# decision with its own evidence.
pcm.jts_ring_lane_spotify {
    type jts_ring
    path "/dev/shm/jts-ring/lane-spotify.ring"
    period_frames 256
    n_slots 16
}

# What librespot's --device points at once armed. The `plug:` wrapper is
# load-bearing and stays: librespot emits 44.1 kHz S24_3 with its own TPDF
# dither, so SOMETHING must convert to the lane's 48 kHz S16_LE, and doing it
# here keeps that conversion on `defaults.pcm.rate_converter` — the knob whose
# fallback to ALSA's built-in linear resampler cost ~12 dB of 4-8 kHz in the
# 2026-05 AEC investigation. Same wrapper, same converter, same rate pair as the
# librespot_substream alias it replaces; only the slave moves.
pcm.librespot_ring_lane {
    type plug
    slave {
        pcm "jts_ring_lane_spotify"
        rate 48000
        channels 2
        format S16_LE
    }
}
