# JTS renderer-ingress lane PCMs — audio-graph consolidation U3 / P6.
#
# The write side of a renderer's SHM slot ring: each block here is the ALSA PCM a
# migrated renderer writes INSTEAD of its snd-aloop substream, and jasper-fanin
# reads the same ring file from the other end
# (rust/jasper-fanin/src/mixer/ring_capture.rs).
#
# INERT UNTIL ARMED. Shipping these definitions on every box is safe and costs
# nothing: an ALSA PCM definition is not an open. Nothing resolves these names
# until `jasper-audio-config renderer-lanes --arm <label>` has written the
# matching JASPER_<RENDERER>_DEVICE into /var/lib/jasper/renderer_lanes.env and
# the renderer has restarted. On every unarmed box the renderer keeps writing its
# `*_substream` alias in /etc/asound.conf, byte-identically to before this file
# existed.
#
# The snd-aloop lane definitions in deploy/alsa/asoundrc.jasper STAY until P9.
# They are the not-yet-migrated boxes' path, not a fallback mode — a lane is on
# exactly one transport at a time, chosen per box, and both definitions existing
# is what makes the migration one lane at a time instead of one fleet at once.
#
# Renderer-user resolvability (AGENTS.md, the PR #214 class): this is a
# system-wide /etc/alsa/conf.d/*.conf drop-in at mode 0644, so the non-root
# renderer users (librespot as `pi`, shairport-sync as `shairport-sync`) can
# resolve these names. Resolving the NAME is only half of it — writing the ring
# FILE additionally needs the renderer user in the /dev/shm/jts-ring directory's
# group (`jts-ring`) and `UMask=0007` on the renderer unit, because BOTH ends
# write the ring header (the reader stamps read_seq + its heartbeat) and a file
# created under the default 0022 umask would land group-unwritable.
# jasper-doctor's `check_renderer_device_resolvable` runs the open probe against
# whichever device the renderer is actually configured with.
#
# GEOMETRY — why these numbers, and what breaks if they drift.
#
# A renderer ring's slot IS one jasper-fanin render period, and its depth is
# DERIVED from the aloop cushion it replaces:
#
#     period_frames = JASPER_FANIN_PERIOD_FRAMES            (shipped 256)
#     n_slots       = JASPER_FANIN_INPUT_BUFFER_FRAMES
#                     / JASPER_FANIN_PERIOD_FRAMES          (shipped 4096/256 = 16)
#
# The depth is derived rather than picked because the aloop lane gives the
# renderer exactly JASPER_FANIN_INPUT_BUFFER_FRAMES of cushion (fan-in opens the
# capture side with that buffer and snd-aloop locks the pair to it), and a
# renderer is a network player whose ALSA write blocks when its buffer fills.
# Handing it a different cushion would silently change how much network jitter it
# absorbs before it underruns — a behaviour change wearing a transport change's
# clothes. The values below are that rule evaluated at the SHIPPED fan-in
# geometry, which is what every box in the fleet runs.
#
# A box that overrides either fan-in key moves the rule's output without moving
# this file. That shear does NOT corrupt audio — but WHICH END fails depends on
# who creates the ring first, and on a running box that is normally fan-in:
# `RingReader::create_or_attach` creates the file when absent, so fan-in's
# geometry is the one that lands in a fresh header and the RENDERER then fails
# its own `snd_pcm_open` (the ioplug's attach compares the header against this
# conf.d and returns a hard error). The renderer is the loud half; the lane
# simply never receives frames. In the other order — a ring left on tmpfs from a
# previous geometry — fan-in is the half that refuses, reporting `source:"ring"`
# with `attached:false` and `detach_reason:"geometry"` in /state while it renders
# silence and retries. `jasper-audio-config renderer-lanes` clears a
# geometry-mismatched ring on every arm/disarm so that second case self-heals,
# and jasper-doctor's `check_renderer_ring_lanes` names either one. Fixing the
# underlying disagreement means reverting the fan-in override or re-rendering
# these two values to match; there is no third option, because the ring header
# cannot describe two geometries.
#
# The ioplug .so (libasound_module_pcm_jts_ring.so) is compiled on the Pi from
# c/jts-ring-ioplug and installed by deploy/lib/install/ring-platform.sh, which
# also installs this file. `type jts_ring` resolves to it.
#
# WIDTH. Each ring below declares `format S32_LE` — the wire an undeclared box
# resolves (`JASPER_FANIN_RING_WIRE_FORMAT` defaults wide), which is what fan-in
# builds this lane's attach geometry from. Renderer ingress is not a second
# width axis. Unlike 60-jts-ring.conf, which `jasper-audio-config
# render-ring-conf-wire` rewrites per box, nothing rewrites these blocks — so
# the width joins the two geometry values above as something a fan-in env
# override shears from, with the same loud failure and the same remedy (deploy a
# narrowed source; ADR-0100 recovery is revert + redeploy).
#
# OWED ON-BOX CONFIRMATION (P6a). The plug: wrapper below negotiates hw_params
# against the ioplug at a SINGLE point — the wrapper declares 48 kHz stereo and
# the ioplug advertises exactly one format at that rate, so there is no range
# for ALSA to choose within. That should mean librespot's own open either
# matches or fails loudly, with no silent middle. It has NOT been exercised
# against a real librespot open on hardware: the whole of P6a ships unarmed, so
# no renderer has ever opened one of these PCMs. Confirm on the first armed box
# that librespot negotiates cleanly, and that a deliberately mismatched period
# fails its open rather than degrading quietly.

# --- Spotify Connect (librespot) — P6a -------------------------------------
#
# The ring itself, at the box's wire (see WIDTH above). `channels` is OMITTED,
# which takes the ioplug's own default (2).
pcm.jts_ring_lane_spotify {
    type jts_ring
    path "/dev/shm/jts-ring/lane-spotify.ring"
    format S32_LE
    period_frames 256
    n_slots 16
}

# What librespot's --device points at once armed. The `plug:` wrapper is
# load-bearing and stays: librespot emits 44.1 kHz S24_3 with its own TPDF
# dither, so SOMETHING must resample to 48 kHz, and doing it here keeps that
# conversion on `defaults.pcm.rate_converter` — the knob whose fallback to
# ALSA's built-in linear resampler cost ~12 dB of 4-8 kHz in the 2026-05 AEC
# investigation. The slave declares no `format`: the ring above owns the width,
# so the resampler's >16-bit result now reaches fan-in instead of being
# truncated to 16 bits without dither (#3460).
pcm.librespot_ring_lane {
    type plug
    slave {
        pcm "jts_ring_lane_spotify"
        rate 48000
        channels 2
    }
}

# --- Bluetooth A2DP (bluealsa-aplay) — P6b ---------------------------------
#
# Same shape as the Spotify lane above; only the label and the renderer differ.
# The ring is named for the fan-in LANE (`bluealsa` — fan-in's own vocabulary,
# see jasper/renderer_lanes.py), the plug PCM for the RENDERER, matching the
# existing `bluealsa_substream` / `librespot_ring_lane` naming.
pcm.jts_ring_lane_bluealsa {
    type jts_ring
    path "/dev/shm/jts-ring/lane-bluealsa.ring"
    format S32_LE
    period_frames 256
    n_slots 16
}

# What bluealsa-aplay's --pcm points at once armed.
#
# The `plug:` wrapper matters MORE here than on any other lane: Bluetooth's
# negotiated PCM varies by codec and by peer (SBC/AAC, 44.1 or 48 kHz), and
# bluealsa-aplay opens whatever the connected device negotiated — where
# librespot at least emits one fixed shape. This is therefore the only lane
# whose rate conversion is genuinely dynamic across connections, which is
# exactly why it must stay on `defaults.pcm.rate_converter` rather than falling
# back to ALSA's built-in linear resampler.
pcm.bluealsa_ring_lane {
    type plug
    slave {
        pcm "jts_ring_lane_bluealsa"
        rate 48000
        channels 2
    }
}

# --- Correction / commissioning measurement lane — P6c-ii -------------------
#
# The first UNITLESS lane: no renderer daemon writes it. Its writers are
# ephemeral `aplay` spawns (room-correction sweeps, commissioning tones,
# sync markers, AEC probes) from jasper-web, the root
# jasper-correction-web and streambox variants, and root operator CLIs — all
# routed through jasper.audio_measurement.correction_lane, which resolves
# armed-vs-unarmed per spawn. Arming therefore restarts jasper-fanin ONLY;
# there is no renderer unit to bounce, and the next spawn simply opens this
# PCM instead of the correction_substream aloop alias.
# Its width moves with every other lane's, which does NOT change what a banked
# measurement was excited with: every producer here plays a 16-bit WAV
# (jasper/audio_measurement/sweep.py, program.py), so the excitation is
# quantized upstream of the transport.
pcm.jts_ring_lane_correction {
    type jts_ring
    path "/dev/shm/jts-ring/lane-correction.ring"
    format S32_LE
    period_frames 256
    n_slots 16
}

# What the correction-lane spawns open once armed.
#
# The `plug:` wrapper mirrors the correction_substream alias it replaces
# (deploy/alsa/asoundrc.jasper: `type plug` over hw:Loopback,0,4 with the same
# pinned slave) — same wrapper, same defaults.pcm.rate_converter, same 48 kHz
# stereo target; only the slave moves. One conversion in that wrapper is
# LOAD-BEARING with a recorded safety consequence and is reproduced here
# DELIBERATELY: the plug's mono→stereo upmix. Six of the lane's producers emit
# MONO WAVs and three emit stereo; the plug absorbs both by duplicating a mono
# program to BOTH channels — which on an active 2-way graph means a woofer-only
# program also reaches the tweeter feed (#2046 records the consequence and the
# level-authority reasoning). Dropping or narrowing the upmix here would not
# make that safer: it would break the six mono producers' opens outright, and
# per-driver protection belongs to the CamillaDSP graph, not this wrapper.
pcm.correction_ring_lane {
    type plug
    slave {
        pcm "jts_ring_lane_correction"
        rate 48000
        channels 2
    }
}

# --- AirPlay 2 (shairport-sync) — P6d --------------------------------------
#
# The LAST renderer lane, and the one whose device is delivered by a conf
# renderer rather than an ExecStart env substitution: /etc/shairport-sync.conf
# is re-rendered from its template on every unit start
# (jasper-apply-airplay-mode, the artifact's single writer), and that script
# reads the lane map's resolved JASPER_SHAIRPORT_DEVICE line to pick between
# the shairport_substream aloop alias and this pair.
pcm.jts_ring_lane_airplay {
    type jts_ring
    path "/dev/shm/jts-ring/lane-airplay.ring"
    format S32_LE
    period_frames 256
    n_slots 16
}

# What the rendered shairport-sync.conf's output_device names once armed.
#
# The `plug:` wrapper now converts NOTHING: shairport emits 48 kHz S32
# stereo (output_rate = 48000, output_format = "S32" in the rendered conf)
# and the lane is 48 kHz at the same width, so both the S32→S16 truncation
# the aloop alias performs and the wrapper's resample are gone from this
# route. With unity softvol (ADR-0206's `ignore_volume_control`) the
# sender's stream reaches fan-in at full width and attenuation happens
# once, in CamillaDSP's float master.
# The rate pair matches because it MUST: shairport 5.x probes the device
# with ALSA resampling disabled and exact-rate matching, so a wrapper rate
# that differs from this slave's is struck from its permissible rate set
# and every session dies (see the output_rate note in
# deploy/shairport-sync.conf.template). shairport does the 44.1 -> 48
# conversion internally instead, which takes the AirPlay route off
# `defaults.pcm.rate_converter` — the knob whose fallback to ALSA's linear
# resampler cost ~12 dB of 4-8 kHz in the 2026-05 AEC investigation — so
# the /system/ converter toggle no longer affects AirPlay. AirPlay SYNC constants are derived from this lane's ring
# geometry — see the LANE GEOMETRY note atop
# deploy/shairport-sync.conf.template before retuning.
pcm.shairport_ring_lane {
    type plug
    slave {
        pcm "jts_ring_lane_airplay"
        rate 48000
        channels 2
    }
}
