# Override the default ExecStart in /lib/systemd/system/bluealsa-aplay.service
# to pipe Bluetooth A2DP audio into the JTS music chain.
#
# Bluetooth writes to its private snd-aloop lane. jasper-fanin reads
# the capture side, sums it with the other renderer lanes, and publishes
# the single music stream to CamillaDSP/AEC. The plug wrapper in
# /etc/asound.conf handles bluealsa's negotiated format/rate.
#
# On a box whose bluealsa lane is ARMED for ring ingress (U3/P6b), the same
# ${JASPER_BLUEALSA_DEVICE} resolves to bluealsa_ring_lane and the audio
# reaches fan-in over an SHM slot ring instead — same private-lane property,
# same mux policy, different transport. Nothing else about this unit changes,
# and mux is untouched: it detects Bluetooth through `bluealsa-cli list-pcms`
# and preempts through AVRCP, neither of which knows this device name.
[Unit]
After=jasper-fanin.service
Wants=jasper-fanin.service
ConditionPathExists=/run/jasper-source-intent/allowed/bluetooth

[Service]
TimeoutStartSec=2s
TimeoutStopSec=5s
# The ALSA PCM this renderer writes. The DEFAULT is the shipped snd-aloop lane,
# so a box with no lane map — every box today — behaves byte-identically to
# before this variable existed. jasper-audio-config's `renderer-lanes` writer
# overrides it in renderer_lanes.env below when this lane is armed.
Environment="JASPER_BLUEALSA_DEVICE=bluealsa_substream"
# LAST, so it beats the Environment= default above (systemd applies a later
# EnvironmentFile= over an earlier Environment=). jasper.renderer_lanes is the
# single writer; jasper-fanin.service loads the same file for its half.
EnvironmentFile=-/var/lib/jasper/renderer_lanes.env
# Ring-file mode (U3/P6b). bluealsa-aplay runs as ROOT — its packaged unit sets
# no User= and neither does this drop-in — so unlike librespot it needs NO
# jts-ring group membership: uid 0 writes the 2775 ring directory regardless.
# The umask still matters, and for the OTHER end: the ioplug creates the ring
# 0660 & ~umask, so under systemd's default 0022 a root-created ring lands 0640
# root:jts-ring. fan-in is root today and can still write it, but that is an
# accident of both ends being root, not a property — and it breaks the moment
# fan-in drops to a non-root user. Setting it here makes the ring
# group-writable whichever end creates it, which is the invariant P6a
# established.
UMask=0007
# RESTART CADENCE lives in the sibling drop-in `jts-restart.conf`, which has
# owned it since before this lane wrote a ring: Restart=always, RestartSec=5,
# StartLimitIntervalSec=600, StartLimitBurst=20. Do NOT duplicate it here —
# two drop-ins setting one directive is a second source of truth for the same
# fact, even when they happen to agree.
#
# It is load-bearing for the ring, which is new: a SIGKILLed ring writer stays
# refused for up to JTS_RING_WRITER_LIVENESS_TIMEOUT_NS (2 s) by the secondary
# heartbeat guard, so a renderer respawning faster would race its predecessor
# into EBUSY and, with a tight start limit, park the unit. RestartSec=5 already
# clears that and the burst window already tolerates it — the values were
# chosen for OOM/device churn and happen to satisfy the ring constraint too.
# `tests/test_renderer_ring_lanes.py` now pins them against the C constant so
# the coincidence cannot quietly stop being true.
UnsetEnvironment=LD_PRELOAD LD_LIBRARY_PATH LD_AUDIT GLIBC_TUNABLES
ExecStart=
ExecStart=/usr/bin/bluealsa-aplay -S --pcm=${JASPER_BLUEALSA_DEVICE}
