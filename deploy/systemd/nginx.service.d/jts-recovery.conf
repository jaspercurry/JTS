# JTS management front door hardening.
#
# nginx is package-owned, but JTS depends on it for the browser portal,
# static assets, and every nginx-fronted wizard. A transient OOM kill must
# not leave port 80 dark until an operator SSHes in.
[Unit]
StartLimitIntervalSec=600
StartLimitBurst=20

# nginx binds a wildcard socket and every upstream it proxies is on loopback,
# so it never needs a routable address. Ordering it after
# network-online.target parks the management front door behind
# NetworkManager-wait-online for ~6 s of every boot. systemd cannot drop a
# single entry from a dependency list, so reset both and restate the rest of
# the packaged list, which is
# `After=network-online.target remote-fs.target nss-lookup.target` and
# `Wants=network-online.target` on Debian trixie.
After=
After=remote-fs.target nss-lookup.target
Wants=

[Service]
Restart=always
RestartSec=5

# Protect the recovery surface, but keep it below jasper-control/voice/audio
# in the OOM ladder so the kernel still prefers killing web before the core
# speaker path.
OOMScoreAdjust=-450
