# Single snd-aloop card: "Loopback" carries renderer INGRESS and nothing
# else. Each renderer owns a private playback substream; jasper-fanin reads
# those capture sides, sums them sample-wise, and publishes to the SHM ring —
# the only central transport from fan-in to the DAC (ADR-0100). Nothing
# downstream of fan-in is an snd-aloop lane: CamillaDSP captures the ring,
# jasper-outputd reads the ring, and the AEC bridge takes no ALSA reference —
# it consumes outputd's UDP speaker monitor.
#
# Substream-pair allocation (see deploy/alsa/asoundrc.jasper):
#   0-2, 4  renderer playback lanes (librespot/shairport/bluealsa/correction).
#   3       UNUSED. USB audio is jasper-fanin's DIRECT hw:UAC2Gadget capture;
#           nothing writes this pair and fan-in does not open it.
#   5-7     UNALLOCATED. Each carried a Camilla/outputd hop the SHM ring
#           replaced (ADR-0100); no PCM defines them and no daemon opens them.
#
# pcm_substreams=8 covers pairs 0-7. It is wider than the four pairs in use
# (0-2, 4 — span 0-4) so no surviving pair renumbers, and so jasper-doctor's
# aloop-remnant walker still scans 5-7 for a resurrected lane on boxes whose
# module is already loaded. Removal condition for narrowing it to 5 (together
# with that walker, jasper/cli/doctor/audio_runtime_fanin.py
# `_ALOOP_SUBSTREAMS`): the doctor's foreign-substream positive control needs
# an unregistered in-range pair to open, and pair 3 is now the only one — that
# test has to move there first.
#
# index=6 — clears HDMI (0,1) and the typical USB auto-assign range (3-5).
# Code references the card by name (hw:Loopback,...), but pinning the index
# keeps debug output stable across reboots and immune to udev shuffle.
#
# pcm_notify=0 — with each renderer owning its own substream pair, the capture
# side must NOT be torn down when another substream changes parameters. Today's
# kernel default is also 0; pinning it is insurance against a default flip.
options snd-aloop enable=1 index=6 id=Loopback pcm_substreams=8 pcm_notify=0
