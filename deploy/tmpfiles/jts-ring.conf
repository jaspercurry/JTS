# /etc/tmpfiles.d/jts-ring.conf
#
# The /dev/shm/jts-ring directory that holds the SHM slot rings. The directory
# exists on every box and the files under it carry the central audio path.
# Shipped by deploy/lib/install/ring-platform.sh; see docs/audio-paths.md.
#
# Why a directory, and why it must persist across daemon restarts:
# the ring transport is SPSC — jasper-fanin WRITES a ring the CamillaDSP ioplug
# READS (Ring A), and the CamillaDSP ioplug WRITES a ring jasper-outputd READS
# (Ring B). The writer create-or-attaches the ring FILE under this directory;
# the reader attaches to the same file. The DIRECTORY must already exist and be
# writable by both, and it must survive an outputd (or camilla) restart so a
# bounce does not race directory re-creation — the ring-train guardrail that
# "SHM files survive outputd restart" depends on the directory being stable.
# /dev/shm is tmpfs (volatile), so the tmpfiles entry re-creates the directory
# on every boot; install.sh also applies it immediately so a deploy does not
# wait for a reboot.
#
# Permissions: mode 3775, owner root, group jts-ring.
#   - Group-write (775) + setgid (the 2 bit) so a ring file created here by
#     one daemon is group-writable and group-inherited by the other. Both the
#     writer and the reader WRITE the ring header (the reader stamps read_seq +
#     heartbeat), so both need write access to a file the other created — the
#     EACCES class the on-Pi outputd bring-up hit.
#   - STICKY (the 1 bit, so 2775 -> 3775) so a group member can only DELETE or
#     RENAME a ring file it owns. Group-write on a shared directory otherwise
#     lets any member unlink ANY file in it regardless of that file's own mode:
#     without this a compromised renderer could delete or replace program.ring
#     and content.ring — Ring A and Ring B, the whole post-DSP path — even
#     though it has no business touching them. The same /tmp-style reasoning,
#     for the same reason.
#
#   RESIDUAL, stated rather than implied: sticky bounds DELETE and RENAME, not
#   WRITE. A group member can still OPEN and write any ring file whose mode is
#   0660 group-writable, which is every ring here, because the reader/writer
#   pair genuinely needs that.
#
#   Sticky also NARROWS one self-heal: a stale ring file owned by a DIFFERENT
#   uid can no longer be unlinked by a group peer, so
#   `jasper-audio-config renderer-lanes`'s stale-ring clear (and the ioplug's
#   own reclaim of a magic-less file) fail with EPERM on a ring some other user
#   created. In practice every ring is created by root or by the lane's own
#   renderer, so the owner is the one clearing it; the reachable exception is a
#   ring left by an out-of-unit probe run under sudo, which then needs an
#   explicit root `rm` (or a reboot — /dev/shm is tmpfs). That is the price of
#   the delete narrowing and it is worth paying: the alternative lets a
#   compromised renderer unlink Ring A. So the grant is still directory-wide for writes:
#   a compromised renderer could inject frames into Ring A or Ring B, not only
#   into its own lane. Narrowing that further needs per-lane groups (one group
#   per ring, each renderer in only its own), which is disproportionate for
#   P6a's single migrated lane and is the right question to settle before P6d
#   adds a second non-root renderer.
#   - Group `jts-ring`: a DEDICATED group that grants exactly one thing, write
#     access to the SHM slot rings. Created by
#     deploy/lib/install/service-users.sh, which also adds the non-root renderer
#     users to it. The root ring daemons (fanin, outputd, camilla) are unaffected
#     — root bypasses the group check — so this group exists solely to let a
#     non-root RENDERER write its lane's ring (U3 / P6).
#
#   THE SETGID BIT IS ONLY HALF OF IT. It fixes a new ring file's GROUP; the
#   creating process's umask fixes its MODE. The ioplug creates the ring
#   `0660 & ~umask`, so a renderer unit running under systemd's default 0022
#   would publish a 0640 ring — group-readable, NOT group-writable — and fan-in
#   would then take EACCES stamping read_seq. Every unit that writes a ring
#   therefore carries `UMask=0007`; the JTS daemons already did, and the renderer
#   units gained it at P6.
#
#   NOTE (divergence from the campaign plan doc): the plan's renderer-ingress
#   design section names "root:audio, 2775 or equivalent". This ships the "or
#   equivalent". P1 shipped it as group `jasper` and deferred the real choice to
#   P6, naming two candidates: add the renderer users to `jasper`, or flip this
#   directory to `audio`. P6a took NEITHER, because both trade a wide grant for a
#   narrow need:
#     - `jasper` also carries /var/lib/jasper at mode 0770 plus control_token and
#       household_secret at 0640, so a renderer joining it would gain write on all
#       shared JTS state. The source-intent design already refused
#       exactly this shape for the source-intent files ("renderers do not join the
#       writer group. Their final guard uses a fixed privileged boundary instead").
#     - `audio` is the ALSA *device*-access group (grants /dev/snd), orthogonal to
#       SHM-file sharing, and a much larger membership than the set of processes
#       that should be able to write frames into the mix.
#   A dedicated group is the narrow set AND the narrow grant, and it is the
#   direction this points anyway: a future non-root fan-in or outputd joins
#   `jts-ring` for ring access without either end inheriting the other's state.
#   tmpfiles `d` re-applies owner/group on every boot/apply, so this converges on
#   an existing box without a reboot.
#
# Format per systemd-tmpfiles(5): `d` = create directory (and adjust its mode/
# owner/group if it already exists) at boot and on `--create`.
d /dev/shm/jts-ring 3775 root jts-ring -
