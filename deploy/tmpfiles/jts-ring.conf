# /etc/tmpfiles.d/jts-ring.conf
#
# /dev/shm/jts-ring holds the SPSC SHM slot rings (Ring A: fanin -> CamillaDSP
# ioplug; Ring B: ioplug -> outputd). tmpfs is volatile, so this re-creates
# the directory on every boot; it must survive daemon restarts since a bounce
# must not race directory re-creation. Shipped by
# deploy/lib/install/ring-platform.sh; see docs/audio-paths.md.
#
# mode 3775 root:jts-ring:
#   - group-write + setgid (2775): both writer and reader stamp the ring
#     header (read_seq, heartbeats), so each needs write access to a file the
#     other created. Every unit that writes a ring needs `UMask=0007` for
#     this to hold — systemd's default 0022 would publish a 0640 ring
#     (group-readable, not writable) and the peer would EACCES on it.
#   - sticky (the 1 bit): bounds a group member to deleting/renaming only
#     ring files it owns, so a compromised renderer with write access to the
#     shared directory cannot unlink or replace Ring A/B outright. Group
#     write access to the ring files themselves is unaffected (needed for
#     the reader/writer header stamping above).
#
# Group `jts-ring` (created by deploy/lib/install/service-users.sh) exists
# solely so a non-root renderer can write its lane's ring; root ring daemons
# bypass the group check entirely.
d /dev/shm/jts-ring 3775 root jts-ring -
