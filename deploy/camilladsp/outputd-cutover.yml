---
# Auto-generated JTS DSP config.
# Source: jasper.sound.camilla_yaml.emit_sound_config
# DO NOT HAND-EDIT — update http://jts.local/sound/room/ or
# http://jts.local/sound/eq/ instead.
#
# Structure mirrors deploy/camilladsp/outputd-cutover.yml.
# Room-correction PEQs, when present, run before sound-curve /
# preference-EQ filters. The `master_gain` mixer remains identity so
# the Ducker contract holds.
# output_trim_db=0.000

devices:
  samplerate: 48000
  chunksize: 128
  queuelimit: 1
  target_level: 128
  volume_limit: 0.0
  enable_rate_adjust: false
  capture:
    type: Alsa
    channels: 2
    device: "jts_ring_capture"
    format: S32_LE
  playback:
    type: Alsa
    channels: 2
    device: "jts_ring_playback"
    format: S32_LE

filters:
  flat:
    type: Gain
    parameters: { gain: 0.0000, inverted: false, mute: false }

mixers:
  master_gain:
    channels: { in: 2, out: 2 }
    mapping:
      - dest: 0
        sources: [{ channel: 0, gain: 0, inverted: false }]
      - dest: 1
        sources: [{ channel: 1, gain: 0, inverted: false }]

pipeline:
  - type: Mixer
    name: master_gain
  - type: Filter
    channels: [0]
    names: [flat]
  - type: Filter
    channels: [1]
    names: [flat]
