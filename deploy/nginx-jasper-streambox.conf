# JTS nginx site, streambox profile — local renderers, DSP, grouping, system
# health, plus the assistant wizards. Installed to
# /etc/nginx/sites-enabled/jasper.conf by install.sh.
#
# Identical to the full-speaker site (deploy/nginx-jasper.conf) except that it
# does not include jts-routes-wake.conf: this board class never gets
# WAKE_DETECTION, so /assistant/wake/, /wake-corpus/ and /mic are absent.
# Every other route comes from the same deploy/nginx/ snippets, so the two
# profiles cannot drift apart.
# (There is no separate follower nginx site; follower behaviour is a
# runtime grouping role, not a distinct install tier.)

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    include /etc/nginx/snippets/jts-routes-common.conf;
}

include /etc/nginx/snippets/jts-tls-server.conf;
