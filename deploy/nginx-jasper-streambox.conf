# JTS streambox nginx site — local renderer + DSP management, plus the
# assistant wizards, which jasper-web serves once the tier holds
# Capability.ASSISTANT. Wake-side routes (/assistant/wake/, /wake-corpus/) are
# absent: this board class never gets WAKE_DETECTION. Full speakers use
# deploy/nginx-jasper.conf.
# (There is no separate follower nginx site; follower behaviour is a
# runtime grouping role, not a distinct install tier.)

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # no-store: the landing page carries the WS1 control token baked into a
    # <meta> tag (install_management_static_assets bakes the same index.html
    # for the streambox profile), so it must never be cached. Mirrors the
    # full-profile site (deploy/nginx-jasper.conf).
    location = / {
        root /usr/share/jasper-web;
        try_files /index.html =404;
        add_header Cache-Control "no-store";
    }

    location ~* ^/assets/.+\.js$ {
        root /usr/share/jasper-web;
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    location /assets/ {
        root /usr/share/jasper-web;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /airplay/ {
        proxy_pass http://127.0.0.1:8771/;
        include /etc/nginx/snippets/jts-proxy-headers.conf;
        proxy_buffering off;
        proxy_redirect off;
    }

    location /bluetooth/ {
        proxy_pass http://127.0.0.1:8769/;
        include /etc/nginx/snippets/jts-proxy-headers.conf;
        # A stale first acknowledgement triggers one source-intent retry:
        # 2 * (2737 s broker wait + margin), plus bounded handler/readback slack.
        proxy_read_timeout 5700s;
        proxy_buffering off;
        proxy_redirect off;
    }

    location /spotify/ {
        proxy_pass http://127.0.0.1:8765/;
        include /etc/nginx/snippets/jts-proxy-headers.conf;
        proxy_read_timeout 240s;
        proxy_buffering off;
        proxy_redirect off;
    }

    # The bounce page at jaspercurry/spotify-oauth-callback lands here with
    # ?code=…&state=… in the query string. The OAuth authorization code is a
    # credential; keep it out of the access log (AGENTS.md non-negotiable 3).
    location = /spotify/oauth-callback {
        access_log off;
        proxy_pass http://127.0.0.1:8765/oauth-callback;
        include /etc/nginx/snippets/jts-proxy-headers.conf;
        proxy_read_timeout 240s;
        proxy_buffering off;
        proxy_redirect off;
    }

    location /assistant/voice/ {
        proxy_pass http://127.0.0.1:8767/;
        include /etc/nginx/snippets/jts-proxy-headers.conf;
        proxy_buffering off;
        proxy_redirect off;
    }

    # The OAuth redirect URI is registered outside this repo: the bounce page
    # at jaspercurry/google-oauth-callback sends the browser to
    # http://<host>/google/callback. Nothing here can change where it lands,
    # so this path is pinned on its own, independent of the wizard's prefix.
    location = /google/callback {
        # The OAuth authorization code arrives as a query parameter; keep
        # it out of the access log (AGENTS.md non-negotiable 3).
        access_log off;
        proxy_pass http://127.0.0.1:8768/callback;
        include /etc/nginx/snippets/jts-proxy-headers.conf;
        proxy_buffering off;
        proxy_redirect off;
    }

    location /assistant/google/ {
        # HTTP, not HTTPS: Google rejects `.local` mDNS OAuth redirect URIs,
        # so the flow bounces through GitHub Pages. Mirrors the full site.
        proxy_pass http://127.0.0.1:8768/;
        include /etc/nginx/snippets/jts-proxy-headers.conf;
        proxy_buffering off;
        proxy_redirect off;
    }

    location /sources/ {
        proxy_pass http://127.0.0.1:8773/;
        include /etc/nginx/snippets/jts-proxy-headers.conf;
        # A stale first acknowledgement can require two starts at the 2737 s
        # owner-aware bound; include bounded handler/post-apply readback margin.
        proxy_read_timeout 5700s;
        proxy_buffering off;
        proxy_redirect off;
    }

    # The two area hubs: static pages rendered at install time from the nav
    # manifest (jasper.web.landing), served from disk like `location = /`.
    # Exact match only — the `/sound/` prefix block below still proxies
    # /sound/active-speaker/* and the measurement API URLs.
    location = /sound {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        add_header Cache-Control "no-store, no-cache, max-age=0, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        return 302 /sound/;
    }

    location = /sound/ {
        root /usr/share/jasper-web;
        try_files /sound/index.html =404;
        add_header Cache-Control "no-store";
    }

    location = /assistant {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        add_header Cache-Control "no-store, no-cache, max-age=0, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        return 302 /assistant/;
    }

    location = /assistant/ {
        root /usr/share/jasper-web;
        try_files /assistant/index.html =404;
        add_header Cache-Control "no-store";
    }

    location /sound/eq/ {
        proxy_pass http://127.0.0.1:8784/;
        proxy_set_header X-JTS-Sound-Page eq;
        include /etc/nginx/snippets/jts-proxy-headers.conf;
        proxy_buffering off;
        proxy_redirect off;
    }

    # Trailing slashes are load-bearing on both of these. A bare
    # `location /sound/output` would also match /sound/output-topology, the
    # live API the /sound/ compat proxy below serves. /sound/speaker/ is a
    # SHORTER prefix than /sound/speaker/crossover/ (:8770, further down), and
    # nginx picks the longest prefix match, so the crossover wizard keeps its
    # own backend regardless of the order these are written in.
    location = /sound/speaker { return 308 /sound/speaker/; }
    location /sound/speaker/ {
        proxy_pass http://127.0.0.1:8784/;
        proxy_read_timeout 65s;
        proxy_set_header X-JTS-Sound-Page speaker;
        include /etc/nginx/snippets/jts-proxy-headers.conf;
        proxy_buffering off;
        proxy_redirect off;
    }

    location = /sound/output { return 308 /sound/output/; }
    location /sound/output/ {
        proxy_pass http://127.0.0.1:8784/;
        proxy_read_timeout 65s;
        proxy_set_header X-JTS-Sound-Page output;
        include /etc/nginx/snippets/jts-proxy-headers.conf;
        proxy_buffering off;
        proxy_redirect off;
    }

    # /sound/setup/ was the URL scripts/onboard.sh printed and QUICKSTART.md
    # named, so it lives in bookmarks and in copies already handed out. Both
    # halves of the page URL get a compat redirect (ADR-0253 §3) to the page
    # that inherited its speaker content; an exact match beats the prefix, so
    # only the page itself redirects. Everything UNDER the old prefix is
    # proxied instead: a tab opened before the move fires stop/abort POSTs at
    # its own origin on pagehide, and a 301 turns those into GETs that never
    # land. Remove all three blocks once the nginx access log shows no hits on
    # /sound/setup.
    location = /sound/setup { return 301 /sound/speaker/; }
    location = /sound/setup/ { return 301 /sound/speaker/; }
    location /sound/setup/ {
        proxy_pass http://127.0.0.1:8784/;
        proxy_read_timeout 65s;
        proxy_set_header X-JTS-Sound-Page speaker;
        include /etc/nginx/snippets/jts-proxy-headers.conf;
        proxy_buffering off;
        proxy_redirect off;
    }

    # Keep stale audible-session Stop/abort API URLs direct and local.
    location /sound/ {
        proxy_pass http://127.0.0.1:8784/;
        include /etc/nginx/snippets/jts-proxy-headers.conf;
        proxy_buffering off;
        proxy_redirect off;
    }

    location /speaker/ {
        proxy_pass http://127.0.0.1:8783/;
        include /etc/nginx/snippets/jts-proxy-headers.conf;
        proxy_read_timeout 5800s;
        proxy_buffering off;
        proxy_redirect off;
    }

    location /wifi/ {
        proxy_pass http://127.0.0.1:8775/;
        include /etc/nginx/snippets/jts-proxy-headers.conf;
        # The current handler's preflight + optional hidden retry + cleanup +
        # rollback path has a 155 s outer-timeout ceiling. Preserve 25 s of
        # response/scheduling headroom, matching the full-speaker site.
        proxy_read_timeout 180s;
        proxy_buffering off;
        proxy_redirect off;
    }

    location /sound/pair/ {
        proxy_pass http://127.0.0.1:8785/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_redirect off;
    }

    location /assistant/tools/ {
        proxy_pass http://127.0.0.1:8786/;
        include /etc/nginx/snippets/jts-proxy-headers.conf;
        proxy_buffering off;
        proxy_redirect off;
    }

    # 30 s on the next three: each has a POST that makes a synchronous
    # third-party call (Nominatim geocode, HA /api/ probe) before replying.
    location /assistant/transit/ {
        proxy_pass http://127.0.0.1:8777/;
        include /etc/nginx/snippets/jts-proxy-headers.conf;
        proxy_read_timeout 30s;
        proxy_buffering off;
        proxy_redirect off;
    }

    location /assistant/weather/ {
        proxy_pass http://127.0.0.1:8779/;
        include /etc/nginx/snippets/jts-proxy-headers.conf;
        proxy_read_timeout 30s;
        proxy_buffering off;
        proxy_redirect off;
    }

    location /assistant/ha/ {
        proxy_pass http://127.0.0.1:8778/;
        include /etc/nginx/snippets/jts-proxy-headers.conf;
        proxy_read_timeout 30s;
        proxy_buffering off;
        proxy_redirect off;
    }

    location /system/ {
        proxy_pass http://127.0.0.1:8772/;
        include /etc/nginx/snippets/jts-proxy-headers.conf;
        proxy_read_timeout 60s;
        proxy_redirect off;
    }

    location = /assistant/chat { return 308 /assistant/chat/; }

    location /assistant/chat/ {
        proxy_pass http://127.0.0.1:8787/;
        include /etc/nginx/snippets/jts-proxy-headers.conf;
        proxy_read_timeout 30s;
        proxy_redirect off;
    }

    location /volume {
        proxy_pass http://127.0.0.1:8780;
        include /etc/nginx/snippets/jts-proxy-headers.conf;
        proxy_redirect off;
    }

    location = /grouping {
        proxy_pass http://127.0.0.1:8780;
        include /etc/nginx/snippets/jts-proxy-headers.conf;
        proxy_redirect off;
    }

    location /source/ {
        proxy_pass http://127.0.0.1:8780;
        include /etc/nginx/snippets/jts-proxy-headers.conf;
        proxy_redirect off;
    }

    location /debug {
        proxy_pass http://127.0.0.1:8780;
        include /etc/nginx/snippets/jts-proxy-headers.conf;
        proxy_redirect off;
    }

    # Match the full profile: measurement stays on plain HTTP and no household
    # journey step redirects into the self-signed HTTPS origin (issue #2632).
    # Every block here is a longer prefix than the /sound/ compat proxy above
    # (:8784): nginx picks the longest prefix match, not the first one
    # written.
    location = /sound/speaker/crossover { return 308 /sound/speaker/crossover/; }
    # A longer prefix than the /sound/speaker/ page block (:8784) above, so
    # the crossover wizard resolves here and its parent page does not.
    location /sound/speaker/crossover/ {
        proxy_pass http://127.0.0.1:8770/crossover/;
        proxy_http_version 1.1;
        include /etc/nginx/snippets/jts-proxy-headers.conf;
        client_max_body_size 32m;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    location /sound/measurements/ {
        proxy_pass http://127.0.0.1:8770/measurements/;
        proxy_http_version 1.1;
        include /etc/nginx/snippets/jts-proxy-headers.conf;
        client_max_body_size 32m;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    location /sound/bass/ {
        proxy_pass http://127.0.0.1:8770/bass/;
        proxy_http_version 1.1;
        include /etc/nginx/snippets/jts-proxy-headers.conf;
        client_max_body_size 32m;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # Speaker timing (phone-mic marker timing for a bonded stereo pair). It
    # shares the measurement backend's in-process mutex with the crossover
    # walk, and rides both listeners for the same reason the rest of the
    # family does: mic capture needs the HTTPS origin, and no journey step
    # may bounce a household into it (issue #2632).
    location = /sound/pair/sync { return 308 /sound/pair/sync/; }
    location /sound/pair/sync/ {
        proxy_pass http://127.0.0.1:8770/sync/;
        proxy_http_version 1.1;
        include /etc/nginx/snippets/jts-proxy-headers.conf;
        # The capture is a short mono WAV from the browser. Keep this
        # deliberately below the heavier correction cap so a broken browser
        # cannot hand the analyzer a huge correlation job.
        client_max_body_size 2m;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # Exists for the assistant's previously-spoken setup URLs (jasper's
    # voice prompts used to say these bare paths) and the owner's old
    # bookmarks. Remove once the spoken URLs in jasper/voice/prompt.py and
    # the owner's bookmarks have moved on — check the nginx access log for
    # hits on these old prefixes first.
    # Compatibility for the pre-hub bookmarks (docs/web-ia.md, one parent one
    # path). Prefix-preserving, so a deep link and its query string survive:
    # /<name>/x?y -> /assistant/<name>/x?y.
    location /chat/ { return 301 /assistant$request_uri; }
    location /google/ { return 301 /assistant$request_uri; }
    location /ha/ { return 301 /assistant$request_uri; }
    location /tools/ { return 301 /assistant$request_uri; }
    location /transit/ { return 301 /assistant$request_uri; }
    location /voice/ { return 301 /assistant$request_uri; }
    location /weather/ { return 301 /assistant$request_uri; }
    location = /chat { return 301 /assistant/chat/; }

    location = /jts-root-ca.crt {
        root /usr/share/jasper-web;
        try_files /jts-root-ca.crt =404;
        types { } default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="jts-root-ca.crt"';
    }

    location / {
        return 404;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/jts.local.crt;
    ssl_certificate_key /etc/nginx/ssl/jts.local.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:JtsSSL:10m;
    ssl_session_tickets off;

    location = /sound/speaker/crossover { return 308 /sound/speaker/crossover/; }
    location /sound/speaker/crossover/ {
        proxy_pass http://127.0.0.1:8770/crossover/;
        proxy_http_version 1.1;
        include /etc/nginx/snippets/jts-proxy-headers.conf;
        client_max_body_size 32m;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    location /sound/measurements/ {
        proxy_pass http://127.0.0.1:8770/measurements/;
        proxy_http_version 1.1;
        include /etc/nginx/snippets/jts-proxy-headers.conf;
        client_max_body_size 32m;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    location /sound/bass/ {
        proxy_pass http://127.0.0.1:8770/bass/;
        proxy_http_version 1.1;
        include /etc/nginx/snippets/jts-proxy-headers.conf;
        client_max_body_size 32m;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    location = /sound/pair/sync { return 308 /sound/pair/sync/; }
    location /sound/pair/sync/ {
        proxy_pass http://127.0.0.1:8770/sync/;
        proxy_http_version 1.1;
        include /etc/nginx/snippets/jts-proxy-headers.conf;
        client_max_body_size 2m;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    location ~* ^/assets/.+\.js$ {
        root /usr/share/jasper-web;
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    location /assets/ {
        root /usr/share/jasper-web;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        add_header Cache-Control "no-store, no-cache, max-age=0, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        return 302 http://$host$request_uri;
    }
}
