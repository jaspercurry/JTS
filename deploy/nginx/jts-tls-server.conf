# The :443 server block, identical on both profiles — included at http level
# by deploy/nginx-jasper.conf and deploy/nginx-jasper-streambox.conf.
# Installed to /etc/nginx/snippets/jts-tls-server.conf by install.sh's
# install_nginx_site_conf. /etc/nginx/snippets/ is not globbed by nginx.conf,
# so this block is live only where a site conf includes it.
#
# The measurement pages — /sound/speaker/crossover/, /sound/measurements/,
# /sound/bass/ and /sound/pair/sync/. getUserMedia (mic capture) requires a
# secure context, so these are the routes that need HTTPS. The other routes
# stay on port 80 — no point breaking them just because one feature needs TLS.
#
# Do not add HSTS here. This speaker deliberately has split HTTP/HTTPS
# surfaces; HSTS would teach browsers to upgrade every JTS route to
# HTTPS and strand the plain-HTTP wizards behind the 443 catch-all.
#
# Cert chain: install.sh generates a private CA at
# /var/lib/jasper/ca/ca.{crt,key} on first run and a server cert at
# /etc/nginx/ssl/jts.local.{crt,key} on every install. The user
# installs ca.crt on their iPhone once.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/jts.local.crt;
    ssl_certificate_key /etc/nginx/ssl/jts.local.key;

    # Modern-only — every device that's going to use this is iOS 16+
    # or a recent macOS/Chrome. No TLS 1.0/1.1 / RC4 / SHA1 baggage.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:JtsSSL:10m;
    ssl_session_tickets off;

    # The same measurement + asset routes as the port-80 listener above,
    # mapped the same way.
    include /etc/nginx/snippets/jts-routes-measurement.conf;

    # Catch-all for accidental HTTPS navigation to the HTTP-only
    # wizards. This still does not expose any extra upstreams via 443:
    # nginx downgrades the request back to the normal port-80 surface,
    # whose own route table decides whether it is valid or 404.
    # Keep it temporary and non-cacheable so mobile browsers don't learn
    # stale HTTPS/HTTP habits for local hostnames. Unlogged: OAuth callbacks
    # upgraded to HTTPS carry their code (AGENTS.md non-negotiable 3).
    location / {
        access_log off;
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        add_header Cache-Control "no-store, no-cache, max-age=0, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        return 302 http://$host$request_uri;
    }
}
