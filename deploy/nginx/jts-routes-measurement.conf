# The measurement route family — the four proxy routes plus the two
# /assets/ blocks that ride both listeners. Included by
# jts-routes-common.conf (:80) and jts-tls-server.conf (:443). Installed to
# /etc/nginx/snippets/jts-routes-measurement.conf by install.sh's
# install_nginx_site_conf, like every other file here.
#
# Browser mic capture needs the HTTPS origin (getUserMedia requires a secure
# context), and no journey step may redirect a household into the
# self-signed :443 origin — a cert interstitial is un-automatable and
# terrible UX (issue #2632) — so these pages are entered deliberately and
# proxied on both listeners: the crossover/measurements/bass/pair-sync views
# that don't capture audio stay reachable on :80 without a cert prompt, and
# the /assets/ blocks ride both so the same page's CSS/JS never fall through
# to the :443 catch-all and redirect down to HTTP, which browsers block as
# mixed content.
#
# A measurement capture WAV (sweep + pre/post-roll, 48 kHz 16-bit mono) runs
# ~1-2 MB, well over nginx's 1 MB default, so client_max_body_size matches
# the backend cap (MAX_WAV_BODY_BYTES = 32 MB in
# jasper/web/correction_runtime.py, which owns the JSON caps too) and the
# app enforces the single limit with a clean error. This value must stay >=
# every cap in that module. Buffering stays off and the read timeout long
# because the wizard uploads captures and polls status while sweeps and
# filter work are in flight, on mobile Safari.
#
# On :80, every proxy block here is a longer prefix than the /sound/ compat
# proxy and the /sound/speaker/ page block in jts-routes-common.conf (both
# :8784), which is what keeps the crossover wizard off both: nginx picks the
# longest prefix match regardless of which file a block came from or the
# order it was written in.

    location = /sound/speaker/crossover { return 308 /sound/speaker/crossover/; }
    location /sound/speaker/crossover/ {
        proxy_pass http://127.0.0.1:8770/crossover/;
        proxy_http_version 1.1;
        include /etc/nginx/snippets/jts-proxy-headers.conf;
        client_max_body_size 32m;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    location /sound/measurements/ {
        proxy_pass http://127.0.0.1:8770/measurements/;
        proxy_http_version 1.1;
        include /etc/nginx/snippets/jts-proxy-headers.conf;
        client_max_body_size 32m;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    location /sound/bass/ {
        proxy_pass http://127.0.0.1:8770/bass/;
        proxy_http_version 1.1;
        include /etc/nginx/snippets/jts-proxy-headers.conf;
        client_max_body_size 32m;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # Speaker timing (phone-mic marker timing for a bonded stereo pair). It
    # shares the measurement backend's in-process mutex with the crossover
    # walk, and rides both listeners for the same reason the rest of the
    # family does (issue #2632).
    location = /sound/pair/sync { return 308 /sound/pair/sync/; }
    location /sound/pair/sync/ {
        proxy_pass http://127.0.0.1:8770/sync/;
        proxy_http_version 1.1;
        include /etc/nginx/snippets/jts-proxy-headers.conf;
        # The capture is a short mono WAV from the browser. Keep this
        # deliberately below the heavier correction cap so a broken browser
        # cannot hand the analyzer a huge correlation job.
        client_max_body_size 2m;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # Page ES modules (/assets/<page>/js/**/*.js) are the one exception to
    # the immutable rule below: they import each other by relative path, so
    # we can't cache-bust the URL the way app.css is (?v=<sha>). Serve them
    # with revalidation instead — nginx's ETag + a conditional GET yields a
    # 304 when unchanged and picks up new code on the next deploy without
    # ever serving a stale module. This regex location takes precedence over
    # the prefix /assets/ block for .js only; fonts and app.css stay
    # immutable. Fonts are cacheable and served from the Pi, avoiding
    # external Google Fonts requests on LAN-only admin pages.
    location ~* ^/assets/.+\.js$ {
        root /usr/share/jasper-web;
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    location /assets/ {
        root /usr/share/jasper-web;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
