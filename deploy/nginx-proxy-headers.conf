# Shared reverse-proxy headers, included by every proxying `location` block
# in nginx-jasper.conf and nginx-jasper-streambox.conf. Installed to
# /etc/nginx/snippets/jts-proxy-headers.conf by install.sh's
# install_nginx_site_conf.
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
