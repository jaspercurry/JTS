name: Set up checkout, Python, and uv
description: Checkout the repo and install the pinned Python + uv toolchain shared by the tests workflow's Python jobs.

inputs:
  python-version:
    description: Python version for actions/setup-python and astral-sh/setup-uv.
    required: false
    default: "3.13"
  fetch-depth:
    description: Passed through to actions/checkout.
    required: false
    default: "1"

runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: ${{ inputs.fetch-depth }}

    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      with:
        # Pin uv itself so dependency installation is reproducible for the
        # same reason `uv sync --locked` is.
        version: "0.12.9"
        python-version: ${{ inputs.python-version }}
        enable-cache: true
