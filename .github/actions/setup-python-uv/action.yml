name: Set up Python and uv
description: Install the pinned Python + uv toolchain shared by the tests workflow's Python jobs. Run after actions/checkout.

inputs:
  python-version:
    description: Python version for actions/setup-python and astral-sh/setup-uv.
    required: false
    default: "3.13"
  install-full:
    description: Also install PortAudio and the full locked JTS runtime (what the pytest and docs lanes import).
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      with:
        # Pin uv itself so dependency installation is reproducible for the
        # same reason `uv sync --locked` is.
        version: "0.12.9"
        python-version: ${{ inputs.python-version }}
        enable-cache: true

    - name: System deps for sounddevice (portaudio)
      # Bounded against apt-mirror hangs (#2727); the helper's retry budget
      # fits inside the 360 s cap.
      if: ${{ inputs.install-full == 'true' }}
      shell: bash
      run: timeout -k 10 360 scripts/ci-apt-install.sh portaudio19-dev

    - name: Install JTS from committed uv lock
      if: ${{ inputs.install-full == 'true' }}
      shell: bash
      run: uv sync --locked --extra full --extra dev --group openwakeword-onnx

    - name: Install openwakeword without its tflite-runtime dep
      # openwakeword 0.6.0 hard-requires tflite-runtime, which has no
      # Python 3.13 wheel; only its ONNX models are used. Runs after the
      # exact sync, which would otherwise remove the package.
      if: ${{ inputs.install-full == 'true' }}
      shell: bash
      run: uv pip install --python .venv/bin/python --no-deps openwakeword==0.6.0
