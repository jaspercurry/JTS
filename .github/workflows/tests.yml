name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify:
    name: classify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lane: ${{ steps.classifier.outputs.lane }}
      reason: ${{ steps.classifier.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The classifier uses the PR merge-base diff. A shallow fetch can
          # omit that base on a stale branch; comparison failure is safe but
          # would unnecessarily send a landing-only PR through the full farm.
          fetch-depth: 0

      - name: Select fail-closed CI lane
        id: classifier
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci-classify.py

  fast-landing:
    name: fast-landing
    needs: classify
    if: ${{ needs.classify.outputs.lane == 'fast-landing' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      JASPER_VOICE_PROVIDER: gemini
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: "0.12.9"
          python-version: "3.13"
          enable-cache: true

      - name: Install the locked base + landing test toolchain
        # The landing contracts import only the JTS base package and stdlib
        # modules, so the full voice/audio extras and PortAudio apt install
        # would add latency without exercising another contract.
        run: uv sync --locked --group fast-landing

      - name: Cheap syntax, policy, and provenance validation
        run: |
          python3 -m py_compile scripts/ci-classify.py scripts/docs-impact.py
          python3 scripts/check-provenance.py
          python3 scripts/docs-impact.py --validate-only
          .venv/bin/ruff check .

      - name: Complete registered landing contract bundle
        run: |
          set -euo pipefail
          mapfile -t landing_tests < <(
            python3 scripts/ci-classify.py --landing-pytest-targets
          )
          (( ${#landing_tests[@]} > 0 ))
          printf 'landing contract: %s\n' "${landing_tests[@]}"
          .venv/bin/pytest -q --tb=short "${landing_tests[@]}"

  docs:
    name: docs
    # Documentation-only changes: inert prose under docs/, the root
    # operational docs, the PR template, and the doc routing map. Roughly a
    # fifth of merged PRs are this shape, and they were paying the full
    # ~8m24s farm for it.
    #
    # "Inert" is load-bearing. The calibration-agent corpus the product reads
    # at runtime is a package resource (jasper/calibration_agent/corpus/), not
    # a document, so no change this lane can carry reaches product data.
    #
    # The bundle is the registered set of tests that READ documentation --
    # the "pin promises with tests" contracts (AGENTS.md), which assert that
    # a doc still says what the code does. Those are exactly the tests a
    # prose edit can break, and they are pure text assertions. Counts are
    # deliberately not quoted here; the bundle is expected to grow, and
    # `scripts/ci-classify.py --docs-pytest-targets` is the one source of
    # truth for its membership.
    #
    # The bundle RUNS tests/test_ci_classifier.py, so every docs PR
    # re-validates the lane's own registration guard -- but that file is a
    # bundle member, NOT an allowed companion, so a docs PR cannot edit the
    # guard while only the edited guard runs.
    #
    # docs-linkcheck runs here as REQUIRED work. docs-links.yml already goes
    # red on a broken link (it exits non-zero), but it is not a required
    # check -- branch protection requires only `ci` -- so before this lane a
    # docs PR could merge over a red link check. Now it cannot.
    needs: classify
    if: ${{ needs.classify.outputs.lane == 'docs' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JASPER_VOICE_PROVIDER: gemini
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # docs-linkcheck diffs base...head to find changed Markdown.
          fetch-depth: 0

      - name: System deps for sounddevice (portaudio)
        # Several registered doc-contract tests import jasper packages that
        # pull in sounddevice. Paid once here (~11s) so the bundle can import
        # anything the merge lane can, rather than curating a second
        # dependency subset that would drift.
        #
        # Bounded against apt-mirror hangs (#2727); the helper owns the retry
        # budget its 6 minutes must cover.
        timeout-minutes: 6
        run: scripts/ci-apt-install.sh portaudio19-dev

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: "0.12.9"
          python-version: "3.13"
          enable-cache: true

      - name: Install JTS from committed uv lock
        run: uv sync --locked --extra full --extra dev --group openwakeword-onnx

      - name: Install openwakeword without its tflite-runtime dep
        run: uv pip install --python .venv/bin/python --no-deps openwakeword==0.6.0

      - name: Cheap syntax, policy, and provenance validation
        run: |
          python3 -m py_compile scripts/ci-classify.py scripts/docs-impact.py
          python3 scripts/check-provenance.py
          python3 scripts/docs-impact.py --validate-only
          .venv/bin/ruff check .

      - name: Changed-Markdown local link check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/docs-linkcheck.py --base "$BASE_SHA" --head "$HEAD_SHA"

      - name: Complete registered documentation contract bundle
        run: |
          set -euo pipefail
          mapfile -t docs_tests < <(
            python3 scripts/ci-classify.py --docs-pytest-targets
          )
          (( ${#docs_tests[@]} > 0 ))
          printf 'docs contract: %s\n' "${docs_tests[@]}"
          .venv/bin/pytest -q --tb=short "${docs_tests[@]}"

  shell:
    # Static gate for the highest-blast-radius code in the repo: the
    # installer and the deploy/operator scripts mutate a live speaker
    # as root, yet had no syntax/lint check before this job. Two layers:
    #   - `bash -n`: parse-only syntax check; zero false positives.
    #   - `shellcheck --severity=warning`: real-breakage classes
    #     (unparseable constructs, non-constant source) plus the
    #     warning tier — SC2155 declare-and-assign masking exit codes
    #     is a genuine hazard in these `set -e` scripts, and SC2034
    #     unused-var catches flags that parse but silently do nothing.
    # The 8 warning-level findings present when the error-only gate
    # landed (3×SC2034, 2×SC2155, 2×SC1090, 1×SC2010) were fixed
    # file-by-file before this tightened to warning. Extending the
    # selection to the whole deploy tree (2026-07)
    # surfaced 1×SC2164 in the usbsink gadget teardown script (a
    # failed cd would have run relative-path rm/rmdir as root from
    # the wrong CWD on a teardown-race path); the composite-gadget
    # rewrite (#1164) independently shipped the same cd guard, so
    # the widened gate landed with zero outstanding findings.
    # Info/style severities (~35 findings, several intentional ssh
    # client-side expansion patterns) remain ungated; tightening
    # further is a separate triage. Do not loosen below warning.
    needs: classify
    if: ${{ needs.classify.outputs.lane == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: bash -n + shellcheck (warning severity)
        # Select tracked shell files across the whole deploy tree (plus
        # scripts and firmware) by shebang/extension. The
        # shebang/extension filter is the discriminator: install.sh copies
        # deploy content onto production speakers, so any shell file added
        # anywhere under deploy/ should auto-gate — enumerating deploy
        # subdirs individually is how deploy/usbsink sat uncovered for a
        # month (2026-07-04 review). The filter skips deploy's python3
        # entry points (deploy/bin's jasper-deploy-health, deploy/usbsink's
        # uac2_name_patch.py) and never matches shebang-less
        # configs/units/assets; it keeps shebang-less .sh source libraries
        # and scripts/use. shellcheck is preinstalled on ubuntu-latest
        # runners.
        run: |
          set -euo pipefail
          shell_files=()
          while IFS= read -r f; do
            # head -c + tr strips NULs so binary assets under deploy/
            # (woff2 fonts) don't trip bash's null-byte warning; 128
            # bytes is ample for any shebang.
            first_line="$(head -c 128 "$f" | tr -d '\0' | head -n 1 || true)"
            if [[ "$f" != *.sh && "$f" != scripts/use \
                  && "$first_line" != '#!'*bash* \
                  && "$first_line" != '#!'*sh* ]]; then
              continue
            fi
            case "$first_line" in
              '#!'*python*|'#!'*node*) echo "skip (non-shell): $f"; continue ;;
            esac
            shell_files+=("$f")
            bash -n "$f"
          done < <(git ls-files deploy scripts firmware)
          # Floor 95: losing a whole pathspec (scripts ~66 files,
          # deploy ~37) lands well under it; small-path losses are
          # what the required pins below catch.
          if (( ${#shell_files[@]} < 95 )); then
            echo "expected at least 95 tracked shell files, found ${#shell_files[@]}" >&2
            printf 'selected: %s\n' "${shell_files[@]}" >&2
            exit 1
          fi
          for required in deploy/usbsink/jasper-usbgadget-up; do
            found=false
            for f in "${shell_files[@]}"; do
              if [[ "$f" == "$required" ]]; then
                found=true
                break
              fi
            done
            if [[ "$found" != true ]]; then
              echo "required shell file not selected: $required" >&2
              printf 'selected: %s\n' "${shell_files[@]}" >&2
              exit 1
            fi
          done
          echo "bash -n ok over ${#shell_files[@]} shell files"
          shellcheck --severity=warning "${shell_files[@]}"
          echo "shellcheck --severity=warning clean"

  python-policy:
    name: python policy
    needs: classify
    if: ${{ needs.classify.outputs.lane == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      JASPER_VOICE_PROVIDER: gemini
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: "0.12.9"
          python-version: "3.13"
          enable-cache: true

      - name: Install the locked policy test toolchain
        run: uv sync --locked --group fast-landing

      - name: Gate the Python matrix on CI-routing policy
        run: |
          set -euo pipefail
          routing_policy_output="$(
            python3 scripts/ci-classify.py --routing-policy-pytest-targets
          )"
          routing_policy_tests=()
          while IFS= read -r target; do
            [[ -n "${target}" ]] && routing_policy_tests+=("${target}")
          done <<< "${routing_policy_output}"
          if (( ${#routing_policy_tests[@]} == 0 )); then
            echo "CI routing policy returned no pytest targets" >&2
            exit 1
          fi
          printf 'routing policy: %s\n' "${routing_policy_tests[@]}"
          .venv/bin/pytest -q --tb=short "${routing_policy_tests[@]}"

  pytest-matrix:
    name: pytest / py${{ matrix.python-version }}
    needs: [classify, python-policy]
    if: ${{ needs.classify.outputs.lane == 'full' }}
    runs-on: ubuntu-latest
    # The full lane ran 27m43s for 25,774 tests on 2026-09-04 and three
    # sibling runs were cancelled at the old 30-minute limit; headroom until
    # the suite's late-run descriptor exhaustion is fixed.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Deployed-interpreter only (PiOS Trixie ships python3.13 — see
        # deploy/lib/install/python-runtime.sh). Campaign speed measure
        # during the 2026-08 right-sizing refactor; restoring the full
        # matrix afterward is an owner call, recorded via ADR either way.
        python-version: ["3.13"]
    # Default provider for tests that load jasper.config (the config
    # loader hard-fails without this set). Individual tests can override.
    env:
      JASPER_VOICE_PROVIDER: gemini
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: System deps for sounddevice (portaudio)
        # Bounded against apt-mirror hangs (#2727).
        timeout-minutes: 6
        run: scripts/ci-apt-install.sh portaudio19-dev

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          # Pin uv itself so dependency installation is reproducible for
          # the same reason `uv sync --locked` is.
          version: "0.12.9"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Supply-chain provenance check
        run: python3 scripts/check-provenance.py

      - name: Install JTS from committed uv lock
        run: uv sync --locked --extra full --extra dev --group openwakeword-onnx

      - name: Install openwakeword without its tflite-runtime dep
        # openwakeword 0.6.0 hard-requires tflite-runtime, which has no
        # Python 3.13 wheel. We use ONNX models exclusively, so tflite is
        # never imported at runtime. This stays after uv sync because sync
        # is exact by default and would otherwise remove the package.
        run: uv pip install --python .venv/bin/python --no-deps openwakeword==0.6.0

      - name: Lint (ruff)
        if: matrix.python-version == '3.13'
        # ruff ships in the dev extras installed above. Config + rule
        # selection live in [tool.ruff] in pyproject.toml. Runs before
        # the suite for fast feedback on undefined names / dead imports.
        run: .venv/bin/ruff check .

      - name: Type check (mypy; lenient baseline)
        if: matrix.python-version == '3.13'
        # mypy ships in the dev extras installed above. The config starts
        # permissive and baselines current debt with per-module overrides, so
        # this step catches new unbaselined type regressions without turning a
        # partially typed codebase strict on day one.
        run: .venv/bin/mypy

      - name: Test (hardware-free; voice_eval explicitly excluded)
        # voice_eval is the paid LLM suite — never CI material, purely on
        # cost discipline. The test_doctor OPENAI_API_KEY=wiz-key env-leak
        # (via load_env_files) is now contained by conftest.py's autouse
        # _isolate_environ fixture (landed in #256), which snapshots and
        # restores os.environ around every test. --ignore is justified
        # solely by paid-LLM cost — not by the leak, which is fixed.
        # pytest-xdist keeps the merge gate broad without making every PR wait
        # for a serial 6k-test run. Keep the worker count explicit; `-n auto`
        # can over-fan-out on larger machines and make socket/subprocess-heavy
        # tests noisier than the fixed 4-worker gate we validated locally.
        run: scripts/test-merge

  pytest:
    # Keep the historical stable `pytest` context visible during and after
    # the branch-protection cutover. The versioned matrix above fans out the
    # real work; `ci` is the sole long-term required context.
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [classify, python-policy, pytest-matrix]
    if: ${{ always() && needs.classify.outputs.lane == 'full' }}
    steps:
      - name: Require Python policy and all matrix jobs
        run: |
          if [[ "${{ needs['python-policy'].result }}" != "success" ]]; then
            echo "python policy result: ${{ needs['python-policy'].result }}" >&2
            exit 1
          fi
          if [[ "${{ needs['pytest-matrix'].result }}" != "success" ]]; then
            echo "pytest matrix result: ${{ needs['pytest-matrix'].result }}" >&2
            exit 1
          fi
          echo "python policy result: success"
          echo "pytest matrix result: success"

  js:
    needs: classify
    if: ${{ needs.classify.outputs.lane == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Browser module syntax + harnesses
        run: |
          set -euo pipefail
          bash scripts/check-js-syntax.sh
          node tests/js/sound_profile_harness.mjs deploy/assets/sound-profile/js/main.js
          node tests/js/dialog_harness.mjs deploy/assets/shared/js/dialog.js
          node scripts/check-peq-parity.mjs
          node scripts/check-balance-trim-parity.mjs
          node tests/js/correction_render_harness.mjs deploy/assets/correction/js/main.js
          node scripts/check-sensitivity-trim-parity.mjs

  rust:
    # CI formats, lints, compiles, and tests the Rust audio daemons — the
    # pytest job above does not. Keep the historical stable `rust` context
    # visible during and after the branch-protection cutover; `ci` is the sole
    # long-term required context. On full-lane PRs that do not touch
    # Rust-relevant surfaces, this job exits green quickly after
    # scripts/rust-ci-needed. Rust-relevant PRs and every push to main run the
    # full Cargo gate. Without this, a dependency
    # bump (e.g. the `alsa` crate used by jasper-fanin/jasper-outputd) that
    # breaks the build passes CI green and only fails at deploy-time
    # `cargo build` on the Pi, and a logic regression in the output/loudness
    # path goes uncaught. `cargo test --release --locked` mirrors install.sh's
    # release build profile and runs each crate's hardware-free unit tests.
    # scripts/check-rust.sh owns the crate list and the low-noise Rustfmt +
    # default Clippy-with-warnings-as-errors gate used both here and on macOS.
    # Do not broaden to pedantic/restriction lint groups without a separate
    # triage. Pin the Rust toolchain to the Pi/Trixie-era rustc so Clippy's
    # warn-by-default set is not a moving merge gate.
    #
    # History: enabling this gate first surfaced 3 stale jasper-outputd
    # tests (assistant-gain clamp + loudness) that had been red since the
    # "calibrate assistant loudness" rework but were invisible because Rust
    # tests never ran in CI; those expectations were corrected (the
    # calibrated gain is QUIETER, safe-direction) and `cargo test` re-enabled
    # here.
    needs: classify
    if: ${{ needs.classify.outputs.lane == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUST_TOOLCHAIN: "1.85.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Decide whether Rust gate is needed
        id: rust-needed
        run: scripts/rust-ci-needed

      - name: Skip Rust gate when unrelated
        if: steps.rust-needed.outputs.run != 'true'
        run: echo "${{ steps.rust-needed.outputs.reason }}"

      - name: Install pinned Rust toolchain
        if: steps.rust-needed.outputs.run == 'true'
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy

      - name: System deps for the ALSA crate
        if: steps.rust-needed.outputs.run == 'true'
        # Bounded against apt-mirror hangs (#2727).
        timeout-minutes: 6
        run: scripts/ci-apt-install.sh libasound2-dev

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2
        if: steps.rust-needed.outputs.run == 'true'
        with:
          workspaces: |
            rust/jasper-env
            rust/jasper-daemon
            rust/jasper-clock
            rust/jasper-resampler
            rust/jasper-ring
            rust/jasper-host-clock
            rust/jasper-fanin
            rust/jasper-outputd
            rust/jasper-tts-protocol

      - name: Rust formatting + Clippy
        if: steps.rust-needed.outputs.run == 'true'
        run: scripts/check-rust.sh

      - name: jasper-env — build + test (shared environment parsing crate)
        if: steps.rust-needed.outputs.run == 'true'
        working-directory: rust/jasper-env
        run: cargo +"$RUST_TOOLCHAIN" test --release --locked

      - name: jasper-daemon — build + test (shared daemon skeleton crate)
        if: steps.rust-needed.outputs.run == 'true'
        working-directory: rust/jasper-daemon
        run: cargo +"$RUST_TOOLCHAIN" test --release --locked

      - name: jasper-clock — build + test (pure DLL crate; no ALSA)
        if: steps.rust-needed.outputs.run == 'true'
        # The shared clock primitive (spa_dll port). Pure Rust, no libasound,
        # so this is the crate whose convergence/no-oscillation properties are
        # the regression gate for every consumer's loop math.
        working-directory: rust/jasper-clock
        run: cargo +"$RUST_TOOLCHAIN" test --release --locked

      - name: jasper-resampler — build + test (pure resampler crate; no ALSA)
        if: steps.rust-needed.outputs.run == 'true'
        # The shared windowed-sinc resampler + rate controller. Pure Rust, no
        # libasound, so its pass-through / capture-follower frame-count /
        # streaming-continuity / loop-sign properties are the regression gate
        # for the daemon path (jasper-outputd's content_bridge), its sole
        # consumer.
        working-directory: rust/jasper-resampler
        run: cargo +"$RUST_TOOLCHAIN" test --release --locked

      - name: jasper-ring — build + test (pure SHM ring crate; no ALSA)
        if: steps.rust-needed.outputs.run == 'true'
        # PROTOTYPE (latency/ring-proto-shm): the SPSC SHM ping-pong ring
        # reader. Pure Rust (mmap via libc), so its seq/wrap/epoch/attach-resync
        # and golden-layout properties (the cross-language drift pin against the
        # C `_Static_assert`ed header) are the regression gate for the shm_ring
        # content bridge, and run on any host.
        working-directory: rust/jasper-ring
        run: cargo +"$RUST_TOOLCHAIN" test --release --locked

      - name: jasper-host-clock — build + test (pure ladder/servo; no ALSA)
        if: steps.rust-needed.outputs.run == 'true'
        # The shared host-slaved USB clock. The pure ladder/probe/servo/write-gate
        # + the status-fragment byte-shape run with NO features (no libasound), so
        # its ladder-transition / probe / write-gate / clamp / anti-windup /
        # fragment-shape properties are the regression gate for jasper-fanin's
        # USB DIRECT consumer and run on any host.
        working-directory: rust/jasper-host-clock
        run: cargo +"$RUST_TOOLCHAIN" test --release --locked

      - name: jts-ring-ioplug — C core host test + plugin compile check
        if: steps.rust-needed.outputs.run == 'true'
        # The C HALF of the golden-layout drift pin. `make test` compiles
        # jts_ring_shm.c (which pulls in jts_ring_shm.h's offsetof/_Static_assert
        # gates and the ATOMIC_LLONG_LOCK_FREE==2 assert) and runs test_ring_core;
        # `make bench` also compiles both host-safe benchmark entry points.
        # Without this the Rust golden-layout test alone runs in CI, so a C-side
        # offset drift would only fail on-Pi at build-on-pi.sh time. `make plugin`
        # links pcm_jts_ring.c against libasound (installed above as "System deps
        # for the ALSA crate"), giving the ioplug's ALSA-facing staging/stride
        # code an off-Pi compile check too — it only builds the .so here, never
        # installs it; `make install` (writing into the system ALSA plugin dir)
        # stays Pi-only, driven by build-on-pi.sh.
        working-directory: c/jts-ring-ioplug
        run: make test bench plugin

      - name: jasper-tts-protocol — build + test (shared wire-protocol crate)
        if: steps.rust-needed.outputs.run == 'true'
        working-directory: rust/jasper-tts-protocol
        run: cargo +"$RUST_TOOLCHAIN" test --release --locked

      - name: jasper-fanin — build + test (release, locked; mirrors install.sh)
        if: steps.rust-needed.outputs.run == 'true'
        working-directory: rust/jasper-fanin
        run: cargo +"$RUST_TOOLCHAIN" test --release --locked

      - name: jasper-outputd — build + test (release, locked; mirrors install.sh)
        if: steps.rust-needed.outputs.run == 'true'
        working-directory: rust/jasper-outputd
        run: cargo +"$RUST_TOOLCHAIN" test --release --locked

  ci:
    # The only long-term branch-protection context. Keep this aggregate
    # independent of path names: the first-party classifier selects a lane,
    # and this explicit result table fails closed on failure, cancellation,
    # or an unexpectedly skipped/started job.
    name: ci
    needs:
      - classify
      - fast-landing
      - docs
      - shell
      - python-policy
      - pytest-matrix
      - pytest
      - js
      - rust
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LANE: ${{ needs.classify.outputs.lane }}
      CLASSIFY_RESULT: ${{ needs.classify.result }}
      FAST_LANDING_RESULT: ${{ needs['fast-landing'].result }}
      DOCS_RESULT: ${{ needs.docs.result }}
      SHELL_RESULT: ${{ needs.shell.result }}
      PYTHON_POLICY_RESULT: ${{ needs['python-policy'].result }}
      PYTEST_MATRIX_RESULT: ${{ needs['pytest-matrix'].result }}
      PYTEST_RESULT: ${{ needs.pytest.result }}
      JS_RESULT: ${{ needs.js.result }}
      RUST_RESULT: ${{ needs.rust.result }}
    steps:
      - name: Require the selected CI work
        run: |
          set -euo pipefail
          if [[ "${CLASSIFY_RESULT}" != "success" ]]; then
            echo "classifier did not succeed: ${CLASSIFY_RESULT}" >&2
            exit 1
          fi

          case "${LANE}" in
            fast-landing)
              if [[ "${FAST_LANDING_RESULT}" != "success" ]]; then
                echo "fast-landing lane selected work did not succeed: ${FAST_LANDING_RESULT}" >&2
                exit 1
              fi
              for result in \
                "${DOCS_RESULT}" \
                "${SHELL_RESULT}" \
                "${PYTHON_POLICY_RESULT}" \
                "${PYTEST_MATRIX_RESULT}" \
                "${PYTEST_RESULT}" \
                "${JS_RESULT}" \
                "${RUST_RESULT}"
              do
                if [[ "${result}" != "skipped" ]]; then
                  echo "fast-landing lane saw an unexpected full-job result: ${result}" >&2
                  exit 1
                fi
              done
              ;;
            docs)
              if [[ "${DOCS_RESULT}" != "success" ]]; then
                echo "docs lane selected work did not succeed: ${DOCS_RESULT}" >&2
                exit 1
              fi
              for result in \
                "${FAST_LANDING_RESULT}" \
                "${SHELL_RESULT}" \
                "${PYTHON_POLICY_RESULT}" \
                "${PYTEST_MATRIX_RESULT}" \
                "${PYTEST_RESULT}" \
                "${JS_RESULT}" \
                "${RUST_RESULT}"
              do
                if [[ "${result}" != "skipped" ]]; then
                  echo "docs lane saw an unexpected full-job result: ${result}" >&2
                  exit 1
                fi
              done
              ;;
            full)
              if [[ "${FAST_LANDING_RESULT}" != "skipped" ]]; then
                echo "full lane unexpectedly ran fast-landing: ${FAST_LANDING_RESULT}" >&2
                exit 1
              fi
              if [[ "${DOCS_RESULT}" != "skipped" ]]; then
                echo "full lane unexpectedly ran docs: ${DOCS_RESULT}" >&2
                exit 1
              fi
              for result in \
                "${SHELL_RESULT}" \
                "${PYTHON_POLICY_RESULT}" \
                "${PYTEST_MATRIX_RESULT}" \
                "${PYTEST_RESULT}" \
                "${JS_RESULT}" \
                "${RUST_RESULT}"
              do
                if [[ "${result}" != "success" ]]; then
                  echo "full lane selected work did not succeed: ${result}" >&2
                  exit 1
                fi
              done
              ;;
            *)
              echo "Unexpected CI lane: ${LANE:-<empty>}" >&2
              exit 1
              ;;
          esac

          echo "selected lane ${LANE} completed successfully"
