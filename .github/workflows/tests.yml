name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify:
    name: classify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lane: ${{ steps.classifier.outputs.lane }}
      reason: ${{ steps.classifier.outputs.reason }}
      rust: ${{ steps.classifier.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The classifier uses the PR merge-base diff. A shallow fetch can
          # omit that base on a stale branch; comparison failure is safe but
          # would unnecessarily send a landing-only PR through the full farm.
          fetch-depth: 0

      - name: Select fail-closed CI lane
        id: classifier
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci-classify.py

  fast-landing:
    name: fast-landing
    needs: classify
    if: ${{ needs.classify.outputs.lane == 'fast-landing' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      JASPER_VOICE_PROVIDER: gemini
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: ./.github/actions/setup-python-uv

      - name: Install the locked base + landing test toolchain
        # The landing contracts import only the JTS base package and stdlib
        # modules, so the full voice/audio extras and PortAudio apt install
        # would add latency without exercising another contract.
        run: uv sync --locked --group fast-landing

      - name: Cheap syntax, policy, and provenance validation
        run: |
          python3 -m py_compile scripts/ci-classify.py scripts/docs-impact.py
          python3 scripts/check-provenance.py
          python3 scripts/docs-impact.py --validate-only
          .venv/bin/ruff check .

      - name: Complete registered landing contract bundle
        run: |
          set -euo pipefail
          mapfile -t landing_tests < <(
            python3 scripts/ci-classify.py --landing-pytest-targets
          )
          (( ${#landing_tests[@]} > 0 ))
          printf 'landing contract: %s\n' "${landing_tests[@]}"
          .venv/bin/pytest -q --tb=short "${landing_tests[@]}"

  docs:
    name: docs
    # Documentation-only changes: inert prose under docs/, the root
    # operational docs, the PR template, and the doc routing map.
    #
    # "Inert" is load-bearing. Markdown shipped inside the package tree is
    # product data, not a document, so no change this lane can carry reaches it.
    #
    # The bundle is the registered set of tests that READ documentation --
    # the tests AGENTS.md's Defaults -> Tests section calls for, which assert
    # that a doc still says what the code does. Those are exactly the tests a
    # prose edit can break, and they are pure text assertions. Counts are
    # deliberately not quoted here; the bundle is expected to grow, and
    # `scripts/ci-classify.py --docs-pytest-targets` is the one source of
    # truth for its membership.
    #
    # The bundle RUNS tests/test_ci_classifier.py, so every docs PR
    # re-validates the lane's own registration guard -- but that file is a
    # bundle member, NOT an allowed companion, so a docs PR cannot edit the
    # guard while only the edited guard runs.
    needs: classify
    if: ${{ needs.classify.outputs.lane == 'docs' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JASPER_VOICE_PROVIDER: gemini
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # docs-linkcheck diffs base...head to find changed Markdown.
          fetch-depth: 0

      - uses: ./.github/actions/setup-python-uv
        # Registered doc-contract tests import jasper packages that pull in
        # sounddevice, so the docs lane installs what the merge lane can
        # import rather than curating a second dependency subset.
        with:
          install-full: "true"

      - name: Cheap syntax, policy, and provenance validation
        run: |
          python3 -m py_compile scripts/ci-classify.py scripts/docs-impact.py
          python3 scripts/check-provenance.py
          python3 scripts/docs-impact.py --validate-only
          .venv/bin/ruff check .

      - name: Changed-Markdown local link check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/docs-linkcheck.py --base "$BASE_SHA" --head "$HEAD_SHA"

      - name: Complete registered documentation contract bundle
        run: |
          set -euo pipefail
          mapfile -t docs_tests < <(
            python3 scripts/ci-classify.py --docs-pytest-targets
          )
          (( ${#docs_tests[@]} > 0 ))
          printf 'docs contract: %s\n' "${docs_tests[@]}"
          .venv/bin/pytest -q --tb=short "${docs_tests[@]}"

  shell:
    # The installer and operator scripts mutate a live speaker as root.
    # `bash -n` is parse-only; `shellcheck --severity=warning` adds the
    # tier where SC2155 (declare-and-assign masking exit codes) and SC2034
    # (unused vars) live. Do not loosen below warning; info/style are a
    # separate triage.
    needs: classify
    if: ${{ needs.classify.outputs.lane == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: bash -n + shellcheck (warning severity)
        # Select tracked shell files across the whole deploy tree (plus
        # scripts) by shebang/extension. The
        # shebang/extension filter is the discriminator: install.sh copies
        # deploy content onto production speakers, so any shell file added
        # anywhere under deploy/ should auto-gate — enumerating deploy
        # subdirs individually is how deploy/usbsink sat uncovered for a
        # month (2026-07-04 review). The filter skips deploy's python3
        # entry points (deploy/usbsink's uac2_name_patch.py) and never
        # matches shebang-less configs/units/assets; it keeps shebang-less
        # .sh source libraries and scripts/use. shellcheck is preinstalled
        # on ubuntu-latest runners.
        run: |
          set -euo pipefail
          shell_files=()
          while IFS= read -r f; do
            # head -c + tr strips NULs so binary assets under deploy/
            # (woff2 fonts) don't trip bash's null-byte warning; 128
            # bytes is ample for any shebang.
            first_line="$(head -c 128 "$f" | tr -d '\0' | head -n 1 || true)"
            if [[ "$f" != *.sh && "$f" != scripts/use \
                  && "$first_line" != '#!'*bash* \
                  && "$first_line" != '#!'*sh* ]]; then
              continue
            fi
            case "$first_line" in
              '#!'*python*|'#!'*node*) echo "skip (non-shell): $f"; continue ;;
            esac
            shell_files+=("$f")
            bash -n "$f"
          done < <(git ls-files deploy scripts)
          # Floor 95: losing a whole pathspec (scripts ~48 files,
          # deploy ~54) lands well under it; small-path losses are
          # what the required pins below catch.
          if (( ${#shell_files[@]} < 95 )); then
            echo "expected at least 95 tracked shell files, found ${#shell_files[@]}" >&2
            printf 'selected: %s\n' "${shell_files[@]}" >&2
            exit 1
          fi
          for required in deploy/usbsink/jasper-usbgadget-up; do
            found=false
            for f in "${shell_files[@]}"; do
              if [[ "$f" == "$required" ]]; then
                found=true
                break
              fi
            done
            if [[ "$found" != true ]]; then
              echo "required shell file not selected: $required" >&2
              printf 'selected: %s\n' "${shell_files[@]}" >&2
              exit 1
            fi
          done
          echo "bash -n ok over ${#shell_files[@]} shell files"
          shellcheck --severity=warning "${shell_files[@]}"
          echo "shellcheck --severity=warning clean"

  python-policy:
    name: python policy
    needs: classify
    if: ${{ needs.classify.outputs.lane == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      JASPER_VOICE_PROVIDER: gemini
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: ./.github/actions/setup-python-uv

      - name: Install the locked policy test toolchain
        run: uv sync --locked --group fast-landing

      - name: Gate pytest on CI-routing policy
        run: |
          set -euo pipefail
          routing_policy_output="$(
            python3 scripts/ci-classify.py --routing-policy-pytest-targets
          )"
          routing_policy_tests=()
          while IFS= read -r target; do
            [[ -n "${target}" ]] && routing_policy_tests+=("${target}")
          done <<< "${routing_policy_output}"
          if (( ${#routing_policy_tests[@]} == 0 )); then
            echo "CI routing policy returned no pytest targets" >&2
            exit 1
          fi
          printf 'routing policy: %s\n' "${routing_policy_tests[@]}"
          .venv/bin/pytest -q --tb=short "${routing_policy_tests[@]}"

  pytest:
    name: pytest
    needs: [classify, python-policy]
    if: ${{ needs.classify.outputs.lane == 'full' }}
    runs-on: ubuntu-latest
    # About twice the 13-15 minute full run (#5288).
    timeout-minutes: 30
    # Default provider for tests that load jasper.config (the config
    # loader hard-fails without this set). Individual tests can override.
    env:
      JASPER_VOICE_PROVIDER: gemini
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Supply-chain provenance check
        run: python3 scripts/check-provenance.py

      - uses: ./.github/actions/setup-python-uv
        with:
          install-full: "true"

      - name: Lint (ruff)
        # ruff ships in the dev extras installed above. Config + rule
        # selection live in [tool.ruff] in pyproject.toml. Runs before
        # the suite for fast feedback on undefined names / dead imports.
        run: .venv/bin/ruff check .

      - name: Test (hardware-free; voice_eval explicitly excluded)
        run: scripts/test-merge

  js:
    needs: classify
    if: ${{ needs.classify.outputs.lane == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Browser module syntax + harnesses
        run: |
          set -euo pipefail
          bash scripts/check-js-syntax.sh
          node tests/js/sound_profile_harness.mjs deploy/assets/sound-profile/js/main.js
          node tests/js/speaker_setup_test.mjs
          node tests/js/dialog_harness.mjs deploy/assets/shared/js/dialog.js
          node scripts/check-peq-parity.mjs
          node scripts/check-balance-trim-parity.mjs

  rust:
    # Pin Clippy to the Pi/Trixie toolchain so warnings do not change at each run.
    needs: classify
    if: ${{ needs.classify.outputs.lane == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUST_TOOLCHAIN: "1.85.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Skip Rust gate when unrelated
        if: needs.classify.outputs.rust != 'true'
        run: echo "No Rust paths changed"

      - name: Install pinned Rust toolchain
        if: needs.classify.outputs.rust == 'true'
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy

      - name: System deps for the ALSA crate
        if: needs.classify.outputs.rust == 'true'
        # Bounded against apt-mirror hangs (#2727).
        timeout-minutes: 6
        run: scripts/ci-apt-install.sh libasound2-dev

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2
        if: needs.classify.outputs.rust == 'true'
        with:
          workspaces: rust

      - name: Rust formatting + Clippy
        if: needs.classify.outputs.rust == 'true'
        run: scripts/check-rust.sh

      - name: Rust workspace — build + test
        if: needs.classify.outputs.rust == 'true'
        working-directory: rust
        run: cargo +"$RUST_TOOLCHAIN" test --workspace --release --locked

      - name: Host clock without ALSA
        if: needs.classify.outputs.rust == 'true'
        # A workspace build enables fan-in's ALSA feature on the host clock.
        working-directory: rust
        run: cargo +"$RUST_TOOLCHAIN" test -p jasper-host-clock --release --locked

      - name: jts-ring-ioplug — C core host test + plugin compile check
        if: needs.classify.outputs.rust == 'true'
        # The C HALF of the golden-layout drift pin. `make test` compiles
        # jts_ring_shm.c (which pulls in jts_ring_shm.h's offsetof/_Static_assert
        # gates and the ATOMIC_LLONG_LOCK_FREE==2 assert) and runs test_ring_core;
        # `make bench` also compiles both host-safe benchmark entry points.
        # Without this the Rust golden-layout test alone runs in CI, so a C-side
        # offset drift would only fail on the Pi. `make plugin` links
        # pcm_jts_ring.c against libasound (installed above as "System deps
        # for the ALSA crate"), giving the ioplug's ALSA-facing staging/stride
        # code an off-Pi compile check too — it only builds the .so here, never
        # installs it; deploy/lib/install/ring-platform.sh runs `make plugin`
        # again and installs the .so on the Pi.
        working-directory: c/jts-ring-ioplug
        run: make test bench plugin

  ci:
    # The only long-term branch-protection context. Keep this aggregate
    # independent of path names: the first-party classifier selects a lane,
    # and this explicit result table fails closed on failure, cancellation,
    # or an unexpectedly skipped/started job.
    name: ci
    needs:
      - classify
      - fast-landing
      - docs
      - shell
      - python-policy
      - pytest
      - js
      - rust
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LANE: ${{ needs.classify.outputs.lane }}
      CLASSIFY_RESULT: ${{ needs.classify.result }}
      FAST_LANDING_RESULT: ${{ needs['fast-landing'].result }}
      DOCS_RESULT: ${{ needs.docs.result }}
      SHELL_RESULT: ${{ needs.shell.result }}
      PYTHON_POLICY_RESULT: ${{ needs['python-policy'].result }}
      PYTEST_RESULT: ${{ needs.pytest.result }}
      JS_RESULT: ${{ needs.js.result }}
      RUST_RESULT: ${{ needs.rust.result }}
    steps:
      - name: Require the selected CI work
        run: |
          set -euo pipefail
          if [[ "${CLASSIFY_RESULT}" != "success" ]]; then
            echo "classifier did not succeed: ${CLASSIFY_RESULT}" >&2
            exit 1
          fi

          case "${LANE}" in
            fast-landing)
              if [[ "${FAST_LANDING_RESULT}" != "success" ]]; then
                echo "fast-landing lane selected work did not succeed: ${FAST_LANDING_RESULT}" >&2
                exit 1
              fi
              for result in \
                "${DOCS_RESULT}" \
                "${SHELL_RESULT}" \
                "${PYTHON_POLICY_RESULT}" \
                "${PYTEST_RESULT}" \
                "${JS_RESULT}" \
                "${RUST_RESULT}"
              do
                if [[ "${result}" != "skipped" ]]; then
                  echo "fast-landing lane saw an unexpected full-job result: ${result}" >&2
                  exit 1
                fi
              done
              ;;
            docs)
              if [[ "${DOCS_RESULT}" != "success" ]]; then
                echo "docs lane selected work did not succeed: ${DOCS_RESULT}" >&2
                exit 1
              fi
              for result in \
                "${FAST_LANDING_RESULT}" \
                "${SHELL_RESULT}" \
                "${PYTHON_POLICY_RESULT}" \
                "${PYTEST_RESULT}" \
                "${JS_RESULT}" \
                "${RUST_RESULT}"
              do
                if [[ "${result}" != "skipped" ]]; then
                  echo "docs lane saw an unexpected full-job result: ${result}" >&2
                  exit 1
                fi
              done
              ;;
            full)
              if [[ "${FAST_LANDING_RESULT}" != "skipped" ]]; then
                echo "full lane unexpectedly ran fast-landing: ${FAST_LANDING_RESULT}" >&2
                exit 1
              fi
              if [[ "${DOCS_RESULT}" != "skipped" ]]; then
                echo "full lane unexpectedly ran docs: ${DOCS_RESULT}" >&2
                exit 1
              fi
              for result in \
                "${SHELL_RESULT}" \
                "${PYTHON_POLICY_RESULT}" \
                "${PYTEST_RESULT}" \
                "${JS_RESULT}" \
                "${RUST_RESULT}"
              do
                if [[ "${result}" != "success" ]]; then
                  echo "full lane selected work did not succeed: ${result}" >&2
                  exit 1
                fi
              done
              ;;
            *)
              echo "Unexpected CI lane: ${LANE:-<empty>}" >&2
              exit 1
              ;;
          esac

          echo "selected lane ${LANE} completed successfully"
