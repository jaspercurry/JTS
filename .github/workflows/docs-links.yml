name: Docs links

# Fast, deterministic Markdown link check. On a PR this only checks changed
# Markdown files; on push to main it checks the whole tree (--all), so a
# rename/delete's dead link left uncaught by a PR's own diff still surfaces.
# Only repo-local paths and Markdown anchors are validated -- external URLs
# are intentionally ignored.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

# Cancel superseded PR runs: GitHub Actions caps concurrent jobs, and a stale
# run has no value once a newer commit exists. Keep `main` pushes
# uncancellable so post-merge coverage completes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  local-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Check changed Markdown local links
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            python3 scripts/docs-linkcheck.py --base "$BASE_SHA" --head "$HEAD_SHA"
          else
            python3 scripts/docs-linkcheck.py --all
          fi
