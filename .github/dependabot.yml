# Group weekly version updates to limit review and CI bursts. Security updates
# remain ungrouped because `applies-to` keeps its default of `version-updates`.
# Python changes update `uv.lock`; changes on the Pi pin chain must also update
# `deploy/constraints-pi.txt` with `python3 scripts/align-pi-constraint-pins.py`.
# GitHub Actions and Cargo remain separate ecosystems.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # First match wins. Keep development tools ahead of the runtime catch-all
      # because formatter, lint, and type-checker bumps can require source
      # changes unrelated to runtime dependency updates.
      python-dev-tooling:
        patterns:
          - "ruff"
          - "mypy"
          - "pytest*"
      python-runtime:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  # One entry keeps the shared `alsa` dependency atomic across every crate that
  # links libasound. Dependabot groups cannot span separate update entries, and
  # tests/test_build_and_ci_contracts.py requires these manifests to agree.
  - package-ecosystem: "cargo"
    directories:
      - "/rust/jasper-fanin"
      - "/rust/jasper-outputd"
      - "/rust/jasper-host-clock"
      - "/rust/jasper-dual-dac-lab"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      rust-alsa-crates:
        patterns:
          - "*"
