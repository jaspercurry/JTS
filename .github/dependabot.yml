# Group monthly version updates to limit review and CI bursts. Security updates
# remain ungrouped because `applies-to` keeps its default of `version-updates`.
# Python changes update `uv.lock`; changes on the Pi pin chain must also update
# `deploy/constraints-pi.pins` with `python3 scripts/align-pi-constraint-pins.py`.
# GitHub Actions and Cargo remain separate ecosystems.
#
# `deploy/constraints-pi.pins` deliberately isn't named `*.txt`/`*.in`: the uv
# ecosystem's file fetcher matches those extensions (plus `uv.lock`) anywhere
# in the repo tree and would otherwise text-bump its pins directly, skipping
# uv.lock and landing every PR red against tests/test_constraints_pi_resolvable.py
# (#1275). No `exclude-paths`-style option exists to do this via config instead.
#
# `python-runtime` excludes majors (update-types) so one suspect (e.g. an
# openai/google-genai/evdev major) doesn't ride along with a batch of
# harmless patches into a single red PR; majors open individually instead.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      # First match wins. Keep development tools ahead of the runtime catch-all
      # because formatter, lint, and type-checker bumps can require source
      # changes unrelated to runtime dependency updates.
      python-dev-tooling:
        patterns:
          - "ruff"
          - "mypy"
          - "import-linter"
          - "pytest*"
      python-runtime:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  # Dependabot does not descend into composite action directories from "/";
  # each one needs its own entry for its pinned `uses:` refs to be tracked.
  - package-ecosystem: "github-actions"
    directory: "/.github/actions/setup-python-uv"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "cargo"
    directory: "/rust"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      rust-workspace:
        patterns:
          - "*"
