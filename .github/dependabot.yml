# Dependency-update automation for JTS.
#
# Why: JTS is a months-unattended appliance with a security-relevant
# dependency surface (openai, google-genai, httpx, spotipy, onnxruntime,
# pyusb, dbus-next, zeroconf) plus GitHub Actions and Rust crates.
# Without this, CVEs in pinned deps age silently. Dependabot raises
# review-able PRs that the existing pytest + provenance CI gate validates.
#
# Scope note: Python CI consumes uv.lock, so Python dependency PRs must
# update the lock alongside pyproject.toml. GitHub Actions and Rust crates
# remain separate ecosystems below.
#
# Why every ecosystem is grouped: without `groups`, Dependabot raises one PR
# per dependency per directory. The cargo entries below share the same crates
# (alsa, serde, serde_json, anyhow, libc), so a single weekly cycle fanned out
# into 8+ near-identical Rust PRs — and each entry is allowed 5 open PRs, so
# many can land within seconds of each other. That happened on 2026-07-21
# 20:24Z, when there were four entries (a 20-PR ceiling): eight dependabot
# runs were created inside 20 seconds and saturated the 20-concurrent-job
# GitHub Actions ceiling, delaying their own jobs by 137-559s. It is the only
# contention-driven CI queueing episode in the measured window.
#
# Grouping REDUCES the burst rather than removing it. A full-lane PR peaks at
# 6 concurrent jobs (shell + the 3-version pytest matrix + js + rust). One
# grouped PR per group means today's six entries can raise at most 7 a week
# (uv's two groups, github-actions, and one per cargo directory) — ~42 jobs
# against the 20-job ceiling. The durable win is a handful of PRs a week to
# review instead of ~16, and a shorter queue tail. The cost is that a broken
# bump reddens its whole group's PR (exclude that one package, or ask
# Dependabot to split, when it happens).
#
# The two extra cargo directories (jasper-host-clock, jasper-dual-dac-lab)
# raise that weekly ceiling from 5 PRs to 7. That cost is accepted
# deliberately: both crates link `alsa`, and while they were unwatched their
# pinned version drifted away from the daemons' (issue #2266) with nothing
# raising a PR to notice.
#
# `groups` deliberately omits `applies-to`, which defaults to
# "version-updates", so SECURITY updates are structurally ungrouped and are
# exempt from open-pull-requests-limit.
#
# BUT that channel is currently inert on this repository: Dependabot alerts
# and security updates are both DISABLED
# (`gh api repos/jaspercurry/JTS/automated-security-fixes` reports
# `enabled:false`; `.../vulnerability-alerts` 404s), and none of the ~45
# dependabot PRs raised to date has been a security update. So today the
# grouped version-update PRs below are the ONLY path by which a CVE fix
# reaches this repo, which means a red group PR can hold one up — the
# opposite of what the ungrouped-security design intends.
#
# Both features are free on a public repository. Enabling them restores the
# separate fast channel this grouping assumes:
#   gh api -X PUT repos/jaspercurry/JTS/vulnerability-alerts
#   gh api -X PUT repos/jaspercurry/JTS/automated-security-fixes
# Until then, treat the python-runtime group as security-relevant and do not
# let it sit red.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Dependabot assigns a dependency to the FIRST group it matches, so
      # this narrow group must precede the catch-all below. Dev tooling is
      # split out because a ruff or mypy bump routinely requires source
      # fixes (new lint rules, stricter inference) and `pyproject.toml`'s
      # frozen suppression counts are asserted by
      # tests/test_lint_contracts.py. Bundled with the runtime SDKs, one
      # such bump would hold back an openai/google-genai/httpx security
      # update behind unrelated lint work.
      python-dev-tooling:
        patterns:
          - "ruff"
          - "mypy"
          - "pytest*"
      python-runtime:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  # Every crate directory that links libasound gets its own entry. They pin
  # the same shared crates, so each is grouped separately: Dependabot groups
  # cannot span `updates` entries, and one PR per crate keeps a red Cargo.lock
  # scoped to the crate that broke. The four must stay on one `alsa` version —
  # tests/test_build_and_ci_contracts.py fails if a bump lands in one crate
  # and not the rest.
  - package-ecosystem: "cargo"
    directory: "/rust/jasper-fanin"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      jasper-fanin-crates:
        patterns:
          - "*"

  - package-ecosystem: "cargo"
    directory: "/rust/jasper-outputd"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      jasper-outputd-crates:
        patterns:
          - "*"

  # jasper-host-clock links libasound behind its optional `alsa` feature,
  # which jasper-fanin enables unconditionally — so its pin reaches the
  # production binary even though the library crate itself is feature-gated.
  - package-ecosystem: "cargo"
    directory: "/rust/jasper-host-clock"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      jasper-host-clock-crates:
        patterns:
          - "*"

  # jasper-dual-dac-lab is lab-only and install.sh never builds it, so CI's
  # `cargo test --locked` step is its sole rot gate. Left unwatched it aged
  # three minor versions behind the daemons on `alsa`.
  - package-ecosystem: "cargo"
    directory: "/rust/jasper-dual-dac-lab"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      jasper-dual-dac-lab-crates:
        patterns:
          - "*"
