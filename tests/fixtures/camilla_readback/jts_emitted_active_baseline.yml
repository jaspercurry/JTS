---
# Auto-generated active-speaker baseline config.
# Source: jasper.active_speaker.camilla_yaml.emit_active_speaker_baseline_config
# preset_id=preview-default-2way
# baseline_id=baseline-default
# This is a candidate speaker baseline: crossover filters are active, outputs
# are not startup-muted, per-driver correction gain is non-positive, and the
# software volume ceiling remains non-positive.

devices:
  samplerate: 48000
  chunksize: 1024
  queuelimit: 4
  target_level: 2048
  volume_limit: 0.0
  enable_rate_adjust: true
  capture:
    type: Alsa
    channels: 2
    device: "plug:jasper_capture"
    format: S32_LE
  playback:
    type: Alsa
    channels: 2
    device: "outputd_active_content_playback"
    format: S16_LE

filters:
  active_baseline_headroom:
    type: Gain
    parameters: { gain: 0.0000, inverted: false, mute: false }
  as_woofer_woofer_tweeter_5000hz_lp:
    type: BiquadCombo
    parameters:
      type: LinkwitzRileyLowpass
      freq: 5000.0000
      order: 4
  as_tweeter_woofer_tweeter_5000hz_hp:
    type: BiquadCombo
    parameters:
      type: LinkwitzRileyHighpass
      freq: 5000.0000
      order: 4
  as_woofer_delay:
    type: Delay
    parameters:
      delay: 0.0000
      unit: ms
  as_woofer_baseline_gain:
    type: Gain
    parameters: { gain: 0.0000, inverted: false, mute: false }
  as_woofer_baseline_limiter:
    type: Limiter
    parameters:
      soft_clip: true
      clip_limit: -1.0000
  as_tweeter_delay:
    type: Delay
    parameters:
      delay: 0.0000
      unit: ms
  as_tweeter_baseline_gain:
    type: Gain
    parameters: { gain: -0.7000, inverted: false, mute: false }
  as_tweeter_baseline_limiter:
    type: Limiter
    parameters:
      soft_clip: true
      clip_limit: -1.0000

mixers:
  split_active_2way:
    description: "mono source -> 2 protected active outputs"
    labels: ["DAC output 1", "DAC output 2"]
    channels: { in: 2, out: 2 }
    mapping:
      - dest: 0
        sources:
          - { channel: 0, gain: -6.0206, inverted: false }
          - { channel: 1, gain: -6.0206, inverted: false }
      - dest: 1
        sources:
          - { channel: 0, gain: -6.0206, inverted: false }
          - { channel: 1, gain: -6.0206, inverted: false }

pipeline:
  - type: Filter
    channels: [0, 1]
    names: [active_baseline_headroom]
  - type: Mixer
    name: split_active_2way
  - type: Filter
    channels: [1]
    names: [as_woofer_woofer_tweeter_5000hz_lp, as_woofer_delay, as_woofer_baseline_gain, as_woofer_baseline_limiter]
  - type: Filter
    channels: [0]
    names: [as_tweeter_woofer_tweeter_5000hz_hp, as_tweeter_delay, as_tweeter_baseline_gain, as_tweeter_baseline_limiter]
