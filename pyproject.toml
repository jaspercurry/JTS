[project]
name = "jasper-speaker"
version = "0.1.0"
description = "Voice-controlled smart speaker on Raspberry Pi 5 with CamillaDSP and a swappable real-time voice backend (Gemini Live, OpenAI Realtime, xAI Grok)"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "LICENSE-third-party.md"]
dependencies = [
    # systemd watchdog notification (sd_notify protocol). Kept in the
    # base install because jasper-control runs on both full speakers and
    # endpoint-tier renderers with Type=notify.
    "sdnotify>=0.3.2",
]

[project.optional-dependencies]
streambox = [
    # Streambox = local renderers, CamillaDSP, and the assistant reached only
    # through a paired remote's mic (push-to-talk, no wake word). Exactly
    # [full] minus the wake/mic/AEC/XVF runtimes that path never loads.
    # See docs/adr/0217-a-streambox-runs-the-assistant-only-while-a-mic-bearing-remote-is-paired.md
    "google-genai==2.22.0",
    "openai>=3.7.0",
    "audioop-lts>=0.2; python_version >= '3.13'",
    "camilladsp @ https://github.com/HEnquist/pycamilladsp/archive/fdc0d163e02dd73206a493402b43c83502ad83d7.tar.gz#sha256=d9d33cab26c4cabcd85daccfbb39a3294579eed8816fbe0ca77f36fe0370f087",
    "sounddevice==0.5.6",
    "numpy>=1.26,<3",
    "scipy>=1.13,<2",
    "spotipy==2.26.0",
    "httpx==0.28.1",
    "gtfs-realtime-bindings==2.2.0",
    "protobuf==7.36.0",
    "rapidfuzz>=3.6,<4",
    "google-auth>=2.56.0",
    "google-auth-oauthlib>=1.2",
    "google-api-python-client>=2.150",
    "evdev>=2.0; sys_platform == 'linux'",
    "pyalsaaudio>=0.11; sys_platform == 'linux'",
    "pyudev>=0.24",
    "dbus-next>=0.2.3",
    "zeroconf>=0.151.3,<1.0",
]

full = [
    "google-genai==2.22.0",
    # OpenAI Realtime SDK — used by jasper.voice.openai_session for
    # the gpt-realtime-2 backend, and (via the OpenAI-compatible WS
    # endpoint) by jasper.voice.grok_session for the xAI Grok Voice
    # Agent backend. 2.36.0 shipped on 2026-05-07 alongside
    # gpt-realtime-2 and exposes the post-GA `client.realtime.connect`
    # path; older SDKs only have `client.beta.realtime.connect`,
    # which we don't use. Pulls in `websockets` as the realtime
    # transport. Skippable at install time only if the active
    # provider is gemini AND the user is sure they'll never switch.
    "openai>=3.7.0",
    # `audioop` was removed from Python 3.13's stdlib (PEP 594). PiOS
    # Trixie ships 3.13, and jasper.voice.openai_session uses
    # audioop.ratecv to upsample 16 kHz mic audio to the 24 kHz that
    # OpenAI Realtime's `audio/pcm` requires. `audioop-lts` is the
    # maintained backport — drop-in `import audioop` replacement.
    # Conditional on 3.13+ so 3.11/3.12 environments (older Pi OS,
    # CI) keep using the stdlib version transparently.
    "audioop-lts>=0.2; python_version >= '3.13'",
    # pycamilladsp v4.0.0, fetched as a hash-checked archive at the
    # tag commit so Pi installs do not need git. See deploy/provenance.toml.
    "camilladsp @ https://github.com/HEnquist/pycamilladsp/archive/fdc0d163e02dd73206a493402b43c83502ad83d7.tar.gz#sha256=d9d33cab26c4cabcd85daccfbb39a3294579eed8816fbe0ca77f36fe0370f087",
    # openwakeword==0.6.0 is installed by deploy/install.sh with --no-deps
    # because its transitive tflite-runtime dep has no Python 3.13 wheel
    # (PiOS Trixie's default python). We use ONNX models exclusively, so
    # tflite-runtime is never imported at runtime. See install.sh.
    "sounddevice==0.5.6",
    "numpy>=1.26,<3",
    # SciPy is needed for room-correction v2 (jasper.correction.* and the
    # jasper.audio_measurement kernel it consumes): synchronized swept-sine
    # generation, FFT-based deconvolution, and fractional-octave smoothing.
    # Pi 5 1 GB has plenty of free disk for the install (~200 MB) and
    # the runtime RAM cost during measurement is bounded by the
    # measurement_window() pause that frees librespot/shairport/
    # voice-daemon RAM first. ≥1.13 is the first release built against the
    # numpy 2.0 ABI, which numpy>=1.26,<3 above allows.
    "scipy>=1.13,<2",
    "spotipy==2.26.0",
    "httpx==0.28.1",
    "onnxruntime>=1.29",
    # The subway fallback only needs the standard GTFS-Realtime wire
    # schema. nyct-gtfs hard-pins the unsupported protobuf 4.25.3 runtime;
    # use the maintained schema bindings and keep the shared protobuf
    # runtime explicit because ONNX Runtime and the Google client stack
    # consume it too.
    "gtfs-realtime-bindings==2.2.0",
    "protobuf==7.36.0",
    "rapidfuzz>=3.6,<4",
    # XVF3800 control: jasper.xvf.xvf_host talks to the chip's USB
    # vendor-control interface for boot-time profile writes and diagnostics.
    "pyusb>=1.2",
    "libusb_package>=1.0",
    # ALSA-native PCM access for jasper-usbmic and the AEC probe scripts —
    # needed because the USB-mic relay wants nonblocking period writes and
    # explicit gadget-ring occupancy control, and the probes capture the XVF
    # mic directly. NOT for an AEC reference: every reference consumer reads
    # jasper-outputd's UDP speaker monitor now (the bridge since U4/P7-1),
    # so nothing opens a custom asoundrc PCM for it any more.
    "pyalsaaudio>=0.11; sys_platform == 'linux'",
    # Google integration (Calendar + Gmail voice tools). google-auth and
    # google-auth-oauthlib drive the per-account OAuth + refresh flow;
    # google-api-python-client is the discovery-based service factory
    # (resource shapes for `calendar` and `gmail`). Pure-Python, tiny.
    "google-auth>=2.56.0",
    "google-auth-oauthlib>=1.2",
    "google-api-python-client>=2.150",
    # jasper-input: third-party HID accessory bridge (volume knobs,
    # macro pads, etc.) reads /dev/input/event* via python-evdev and
    # watches for hot-plug via pyudev. Tiny pure-Python deps.
    "evdev>=2.0; sys_platform == 'linux'",
    "pyudev>=0.24",
    # Web-driven BT pairing for HID accessories. dbus-next is the
    # asyncio-native bluez D-Bus client; lighter and more reliable
    # than shelling to `bluetoothctl` (parsing its output is flaky
    # across versions). Pure-Python, no C extension.
    "dbus-next>=0.2.3",
    # jasper.peering: mDNS-SD discovery of sibling JTS speakers for
    # multi-device wake arbitration. Used in browse-only mode — the
    # host's Avahi daemon remains the only mDNS responder (peering
    # advertises via /etc/avahi/services/jasper-peer.service, a
    # static XML installed by deploy/install.sh). Browse-only avoids
    # the dual-stack conflict (pyvisa-py#378). Imported lazily inside
    # jasper.peering.discovery so the package is import-cheap when
    # peering is OFF (the default). ~5-8 MB Pss when active.
    "zeroconf>=0.151.3,<1.0",
]

dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.8",
    "ruff>=0.16.1",
    # The day-one baseline is checker-version-sensitive. Bump this
    # deliberately when tightening or regenerating the baseline.
    "mypy>=2.3.0,<2.4",
]

# Keep this dependency group identical to the ``dev`` optional extra above:
# uv consumes the group, while pip users still install ``.[dev]``. The
# cross-frontend contract is pinned by tests/test_dependency_groups.py.
[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.8",
    "ruff>=0.16.1",
    # The day-one baseline is checker-version-sensitive. Bump this
    # deliberately when tightening or regenerating the baseline.
    "mypy>=2.3.0,<2.4",
]
fast-landing = [
    # tests/test_sound_plumbing.py imports sound_setup in a clean child
    # process to prove NumPy/SciPy stay out of cold start. The import reaches
    # the Camilla config parser, whose only non-base dependency is PyYAML.
    "pyyaml==6.0.3",
]
openwakeword-onnx = [
    # Support deps for the ONNX-only openWakeWord runtime installed with
    # `openwakeword==0.6.0 --no-deps`. Keep these lock-covered while avoiding
    # openWakeWord's declared tflite-runtime dep, which has no Python 3.13 wheel.
    "requests",
    "tqdm",
    "scikit-learn>=1,<2",
]

