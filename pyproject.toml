[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[tool.uv]
# Security floors for packages we never import directly — both are
# transitive-only — pyasn1 via google-auth → pyasn1-modules, httplib2
# via google-api-python-client and google-auth-httplib2. A plain
# pyproject.toml dependency line would misrepresent them as things JTS
# imports; a uv constraint bounds whatever pulls them in without adding
# a fake direct dependency. Bump the floor (never lower it) if a future
# CVE lands here.
constraint-dependencies = [
    # CVE-2026-59884 / CVE-2026-59885 / CVE-2026-59886 (quadratic-time
    # OID decode, unbounded BER tag length, Real.__float__ cost) — all
    # three fixed in 0.6.4.
    "pyasn1>=0.6.4",
    # CVE-2026-59939 (unbounded gzip/deflate decompression bomb) — fixed
    # in 0.32.0.
    "httplib2>=0.32.0",
]

[tool.setuptools.packages.find]
# Limit to the `jasper` namespace and its subpackages — without the
# trailing-dot pattern, setuptools' glob would also sweep up sibling
# distributions whose names start with "jasper" (e.g. jasper_aec3,
# our pybind11 binding for WebRTC AEC3 which lives at the repo root
# and is installed as a separate package).
include = ["jasper", "jasper.*"]

[tool.setuptools.package-data]
"jasper" = ["py.typed"]
"jasper.data" = ["*.csv"]
"jasper.active_speaker" = ["presets/*.json"]
# Runtime product data, not documentation: jasper/calibration_agent/tools.py
# rglobs this corpus and injects it into an LLM prompt on the live
# /correction/ wizard.
"jasper.calibration_agent" = ["corpus/*.md", "corpus/**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# `auto` mode applies @pytest.mark.asyncio implicitly to every async
# def test, so we don't have to repeat the marker on every test.
# Required by tests/test_gemini_session.py and tests/test_gemini_connection.py.
asyncio_mode = "auto"
# Hang backstop. An unbounded await whose producer dies never returns —
# before this, one such test blocked the entire local suite with no
# failing test to point at, and the producer's real exception stayed
# swallowed on a task nobody awaited. `signal` fails only the stuck test
# and lets the run continue; `thread` kills the whole process, losing
# every result after it. 300s is ~20x the slowest healthy test (15.1s),
# so this is a hang-breaker and NOT a timing assertion — never tune it
# to make a slow test fail. tests/voice_eval raises it to 900s in its
# own conftest (a paid pass^3 scenario is three sequential live
# sessions). Per-test overrides: @pytest.mark.timeout(N).
timeout = 300
timeout_method = "signal"

[tool.ruff]
target-version = "py311"
# Exclude vendored turntable code; the wrapper is production despite its
# experiments/ path.
extend-exclude = ["experiments/usb-turntable/vendor"]

[tool.ruff.lint]
# Pyflakes `F`, Ruff's default pycodestyle subset (`E4`, `E7`, `E9`),
# and blind-except `BLE` are the bug-catching floor — unused imports,
# undefined names, f-strings without placeholders, syntax/runtime traps,
# and accidental broad exception handlers.
# We intentionally do NOT enable import-sorting (`I`) or pyupgrade (`UP`)
# here: those would rewrite/reorder across the whole tree for no
# correctness gain. Three E-rules are switched off because the codebase
# uses them deliberately and pervasively:
#   E701 — terse one-line guards (`if x: return`)
#   E731 — assigned lambdas
#   E402 — deliberate deferred imports / post-`sys.modules`-stub imports
select = ["E4", "E7", "E9", "F", "BLE"]
ignore = ["E701", "E731", "E402"]

[tool.ruff.lint.per-file-ignores]
# dbus-next reads string type-code annotations off the method signatures
# (`device: "o"` is a D-Bus object path; "s"/"u"/"q" are string/uint32/
# uint16). Ruff resolves those forward-ref strings as names and
# false-flags them as undefined; they are already `# type: ignore`.
"jasper/bluetooth/agent.py" = ["F821"]

[tool.mypy]
python_version = "3.11"
files = ["jasper", "experiments/usb-turntable/jts_turntable.py"]
ignore_missing_imports = true
show_error_codes = true
warn_unused_configs = true

[[tool.mypy.overrides]]
# dbus-next exposes BlueZ/ObjectManager methods dynamically from D-Bus
# introspection XML, e.g. call_connect() and call_get_managed_objects().
# Treat that library boundary as untyped rather than silencing the JTS
# modules that call it.
module = ["dbus_next", "dbus_next.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
# The importable jasper_aec3 package is the pybind11 build's install
# artifact; the repo path of the same name is that build's project
# directory, which mypy resolves first and which exposes none of the
# package's names. Treat it as an untyped boundary rather than annotating
# around a resolution artifact.
module = ["jasper_aec3"]
follow_imports = "skip"

[[tool.mypy.overrides]]
# Day-one baseline generated on 2026-06-19 with mypy 2.1.0. Keep this broad
# but explicit so clean modules are checked now, and tighten by removing
# entries as local type fixes land.
