[build-system]
# Exact pins make the native-extension build reproducible. The optional
# installer uses PEP 517 isolation, so these are provisioned in its temporary
# build environment rather than assumed to exist in /opt/jasper/.venv.
requires = ["setuptools==82.0.1", "pybind11==2.13.6"]
build-backend = "setuptools.build_meta"

[project]
name = "jasper-aec3"
version = "0.1.0"
description = "WebRTC AEC3 binding for the JTS smart-speaker AEC bridge"
requires-python = ">=3.11"
license = "Apache-2.0"
# No runtime install_requires — the only runtime dep is the system
# library libwebrtc-audio-processing-1, which we do NOT manage via pip
# (it ships in Debian Trixie's apt as `libwebrtc-audio-processing-dev`).
# install.sh is responsible for ensuring the apt package is present
# before building this wheel.

[tool.setuptools.packages.find]
where = ["."]
include = ["jasper_aec3*"]
