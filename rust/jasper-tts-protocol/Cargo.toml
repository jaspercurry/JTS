[package]
name = "jasper-tts-protocol"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "JTS shared TTS wire protocol and loudness helpers."
license = "Apache-2.0"
repository = "https://github.com/jaspercurry/JTS"
authors = ["Jasper Curry <jaspercurry@gmail.com>"]

[dependencies]
# The shared width primitives (`widen_i16_to_i32` / `narrow_i32_to_i16_round`)
# the assistant wire's two representations convert through. Pure — no ALSA, no
# threads, no I/O — so this crate stays host-buildable, and both consumers
# (jasper-fanin, jasper-outputd) already depend on it, so nothing new is linked.
jasper-resampler = { path = "../jasper-resampler" }
