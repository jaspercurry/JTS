[package]
name = "jasper-dual-dac-lab"
version = "0.1.0"
edition = "2021"
description = "Lab-only dual Apple USB-C DAC validation runner for JTS active-speaker experiments."
license = "Apache-2.0"
repository = "https://github.com/jaspercurry/JTS"
authors = ["Jasper Curry <jaspercurry@gmail.com>"]
rust-version = "1.75"

[dependencies]
# Idiomatic Rust wrapper around libasound — this lab runner opens both Apple
# DACs directly to validate the dual-device shape. Every ALSA-linking crate in
# rust/ shares one version; tests/test_build_and_ci_contracts.py owns that
# invariant.
alsa = "0.12"
anyhow = "1"
libc = "0.2"
serde_json = "1"
signal-hook = "0.3"

[profile.release]
opt-level = 2
lto = false
codegen-units = 1
strip = "debuginfo"
panic = "abort"

[[bin]]
name = "jasper-dual-dac-lab"
path = "src/main.rs"
