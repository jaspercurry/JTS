[package]
name = "jasper-outputd"
version.workspace = true
edition.workspace = true
description = "JTS final-output owner: writes the final DAC sink and publishes output health/reference taps."
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
jasper-daemon = { path = "../jasper-daemon" }
jasper-tts-protocol = { path = "../jasper-tts-protocol" }
jasper-env = { path = "../jasper-env" }
jasper-resampler = { path = "../jasper-resampler" }
jasper-ring = { path = "../jasper-ring" }
alsa.workspace = true

anyhow = "1"

libc = "0.2"

signal-hook = "0.4"

[dev-dependencies]
serde_json = "1"

[[bin]]
name = "jasper-outputd"
path = "src/main.rs"
