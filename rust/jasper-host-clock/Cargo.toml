[package]
name = "jasper-host-clock"
version.workspace = true
edition.workspace = true
description = "JTS host-slaved USB clock: the daemon-agnostic ladder + probe + servo + write-gate that steers the UAC2 gadget's Capture Pitch ctl so the host tracks the DAC clock."
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
log = "0.4"
alsa = { workspace = true, optional = true }

[dev-dependencies]
serde_json = "1"
jasper-resampler = { path = "../jasper-resampler" }

[features]
# The pure clock tests must also link on hosts without libasound.
default = []
alsa = ["dep:alsa"]

[lib]
name = "jasper_host_clock"
path = "src/lib.rs"
