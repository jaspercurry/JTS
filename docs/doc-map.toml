# Documentation impact map.
#
# This file is a routing layer, not a second architecture spec. It maps
# high-risk code areas to the canonical docs future humans and agents should
# scan when those areas change. Keep entries coarse; false positives are okay
# because the lookup is advisory (`scripts/docs-impact.py --changed-file …`),
# never a gate. CI validates the map; it does not enforce it.

[document_classes]
# Intentionally present top-level docs that are not canonical subsystem
# scan targets. They still satisfy the no-orphan-doc invariant, but a
# code change should not route future maintainers to them as current
# operational truth. Most executed session artifacts move to
# docs/historical/, which sits outside both the orphan sweep and this
# routing map; this list retains the few top-level snapshots that still
# have active links or near-term reference value.
session_artifacts = [
  # (crossover-measurement-reproducibility-plan.md was archived 2026-07-22 —
  # historical decision archaeology, no longer a scan target; current truth
  # is tuning-operator-runbook.md.)
  # Rescued verbatim from draft PR #1851's closed branch (2026-08-08); not an
  # active target for multiroom-grouping code-change routing until the plan
  # is re-verified and executed. Current operational truth remains
  # docs/dumb-endpoint-bringup.md (see docs/doc-map.toml's multiroom-grouping
  # subsystem). Tracked by #1852.
  "docs/multiroom-pairing-reliability-plan.md",
]
# Prior-art research artifacts: long-lived studies kept as reference (each
# tagged `Status: research` in-doc), not canonical operational scan targets.
# They satisfy the no-orphan-doc invariant without routing a future maintainer
# to them as current operational truth.
research = [
  "docs/RESEARCH-pipewire-low-latency.md",
]

[[subsystem]]
id = "ci-and-branch-protection"
title = "CI gates and branch protection"
safety = "safe-ci"
code = [
  ".github/workflows/tests.yml",
  # The executable test lanes and the PR lane classifier. AGENTS.md's "Agent
  # test routing" names these scripts as the source of truth for what a lane
  # runs ("update the script first, then adjust this short routing note and
  # CONTRIBUTING.md"), so a lane change here is exactly the case that must
  # scan those two docs.
  "scripts/test-fast",
  "scripts/test-merge",
  "scripts/_test_lane.sh",
  "scripts/ci-classify.py",
  "scripts/check-js-syntax.sh",
  "scripts/check-rust.sh",
  "scripts/rust-ci-needed",
]
docs = [
  "CONTRIBUTING.md",
  "AGENTS.md",
  "docs/testing-tooling.md",
]
requires_docs_when = [
  "A required check name, Python/Rust/shell CI gate, lint/test placement, matrix coverage, branch-protection expectation, or what a named test lane (`scripts/test-fast` / `scripts/test-merge` / `scripts/check-rust.sh`) actually runs changes.",
]
verification = [
  "python3 scripts/docs-impact.py --validate-only",
]

